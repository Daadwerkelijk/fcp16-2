    'donker':{'--topbar':'#080c14','--topbar-dark':'#030508','--accent':'#c8a840','--bg':'#080c14','--white':'#0e1524','--bg2':'#0e1524','--bg3':'#121b2e','--bg4':'#1a2540','--text':'#e8eef8','--text2':'#9aaccc','--text3':'#5a7090','--border':'#1e2e48','--border2':'#2a3e5c','--line':'#141e30','--line2':'#1e2e48','--red':'#f05050','--field-bg':'#0a1828','--field-border':'#1a3050','--font-ui':"'DM Sans',sans-serif",'--font-mono':"'DM Mono',monospace",'--font-display':"'DM Sans',sans-serif",'--r':'14px','--rsm':'10px','--badge-radius':'100px','--card-shadow':'none'}

<script src="app.js"></script>
<script>
const state = loadState();
let players      = state.players;
let aanwezigheid = state.aanwezigheid;
let customWeken  = state.customWeken;
let absRedenen   = JSON.parse(localStorage.getItem('fcp_abs_redenen') || '["Ziek","Geblesseerd","Leren","Feest","Anders","Onbekend"]');
function saveAbsRedenen(r) {
  localStorage.setItem('fcp_abs_redenen', JSON.stringify(r));
  if (supabaseReady) {
    sbFetch('session_notes?note_key=eq.abs_redenen', 'DELETE').then(() =>
      sbFetch('session_notes', 'POST', { note_key:'abs_redenen', content:JSON.stringify(r) })
    );
  }
}

// ─── AANWEZIGHEID OVERZICHT ───
function renderAanwOverzicht() {
  // Verzamel alle trainingen uit customWeken
  const trainingen = [];
  customWeken.forEach((w, wi) => {
    w.sessies.forEach((s, si) => {
      trainingen.push({ nk: 'cw' + wi + '_' + si, label: s.dag, week: w.focus, datum: w.datum || w.weekNr || '' });
    });
  });

  if (!trainingen.length || !players.length) {
    document.getElementById('aanw-samenvatting').innerHTML = '<div style="font-size:12px;color:var(--text3)">Nog geen trainingen of spelers aangemaakt.</div>';
    document.getElementById('aanw-tabel').innerHTML = '';
    return;
  }

  const sorted = sortedPlayers(players);

  // Samenvatting: totaal aantal trainingen met opgeslagen aanwezigheid
  const metData = trainingen.filter(t => aanwezigheid[t.nk] && Object.keys(aanwezigheid[t.nk]).length > 0);
  const wedstrijden = JSON.parse(localStorage.getItem('fcp_wed') || '[]');
  const aantalWed = wedstrijden.filter(w => w.gespeeld).length;
  document.getElementById('aanw-samenvatting').innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px">
      <div style="padding:11px 13px;background:var(--blauw-l);border:1px solid var(--blauw-m);border-radius:var(--r)">
        <div style="font-size:24px;font-weight:700;color:#1a3799">${trainingen.length}</div>
        <div style="font-size:10px;font-weight:700;color:var(--blauw);text-transform:uppercase;letter-spacing:.05em;margin-top:2px">Trainingen</div>
      </div>
      <div style="padding:11px 13px;background:var(--blauw-l);border:1px solid var(--blauw-m);border-radius:var(--r)">
        <div style="font-size:24px;font-weight:700;color:#1a3799">${aantalWed}</div>
        <div style="font-size:10px;font-weight:700;color:var(--blauw);text-transform:uppercase;letter-spacing:.05em;margin-top:2px">Wedstrijden</div>
      </div>
    </div>`;

  // Tabel: spelers als rijen, trainingen als kolommen
  // Compactere weergave: per speler totaal afwezig + per reden telling + per training symbool
  let html = '';

  // Per speler samenvatting
  html += '<div style="display:flex;flex-direction:column;gap:8px">';
  sorted.forEach(p => {
    let totaalAfw = 0;
    const redenTelling = {};
    const trainingsDetails = [];

    trainingen.forEach(t => {
      const entry = aanwezigheid[t.nk]?.[p.id];
      let isAfw = false;
      let reden = '';
      if (entry === false) { isAfw = true; } // oud formaat
      else if (entry && entry.afwezig === true) { isAfw = true; reden = entry.reden || ''; }
      if (isAfw) {
        totaalAfw++;
        redenTelling[reden || 'Onbekend'] = (redenTelling[reden || 'Onbekend'] || 0) + 1;
      }
      trainingsDetails.push({ label: t.label, week: t.week, isAfw, reden });
    });

    if (totaalAfw === 0) return; // Toon alleen spelers met minstens 1 afwezigheid

    const redenBadges = Object.entries(redenTelling).map(([r, n]) =>
      `<span style="font-size:10px;padding:1px 6px;background:var(--bg3);border:1px solid var(--line2);border-radius:10px;color:var(--text3)">${r}: ${n}x</span>`
    ).join('');

    const detailRows = trainingsDetails.filter(d => d.isAfw).map(d =>
      `<div style="display:flex;gap:8px;align-items:center;padding:4px 0;border-bottom:1px solid var(--line2)">
        <span style="font-size:11px;color:var(--text3);flex:1">${d.week} · ${d.label}</span>
        <span style="font-size:11px;color:var(--text3)">${d.reden || '—'}</span>
      </div>`
    ).join('');

    html += `<div style="background:var(--bg2);border:1px solid var(--line2);border-radius:var(--rsm);overflow:hidden">
      <div onclick="toggleSpelerDetail('detail-${p.id}')" style="display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer">
        <div style="flex:1">
          <div style="font-size:13px;color:var(--text);font-weight:500">${p.naam}</div>
          <div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:4px">${redenBadges}</div>
        </div>
        <div style="text-align:right;flex-shrink:0">
          <div style="font-size:18px;font-weight:700;color:var(--text2)">${totaalAfw}×</div>
          <div style="font-size:10px;color:var(--text3)">afwezig</div>
        </div>
      </div>
      <div id="detail-${p.id}" style="display:none;padding:0 12px 10px;border-top:1px solid var(--line2)">
        ${detailRows}
      </div>
    </div>`;
  });
  html += '</div>';

  // Als geen spelers afwezig zijn geweest
  if (!sorted.some(p => {
    return trainingen.some(t => {
      const e = aanwezigheid[t.nk]?.[p.id];
      return e === false || (e && e.afwezig === true);
    });
  })) {
    html = '<div style="font-size:12px;color:var(--text3);padding:12px 0">Nog geen afwezigheid geregistreerd.</div>';
  }

  document.getElementById('aanw-tabel').innerHTML = html;
}

function dashTab(tab) {
  const tabs = ['afwezig','skills'];
  tabs.forEach(t => {
    const panel = document.getElementById('dpanel-' + t);
    const btn   = document.getElementById('dtab-' + t);
    if (!panel || !btn) return;
    const actief = t === tab;
    panel.style.display = actief ? 'block' : 'none';
    btn.style.borderColor = actief ? 'var(--topbar)' : 'var(--border)';
    btn.querySelector('div:nth-child(2)').style.color = actief ? 'var(--topbar)' : 'var(--text)';
  });
}

function toggleSpelerDetail(id) {
  const el = document.getElementById(id);
  if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

// ─── REDENEN BEHEREN ───
function openRedenModal() {
  renderRedenList();
  document.getElementById('bmodalRedenen').classList.add('open');
}
function closeRedenModal() {
  document.getElementById('bmodalRedenen').classList.remove('open');
  renderAanwOverzicht();
}

function renderRedenList() {
  const cont = document.getElementById('reden-list'); cont.innerHTML = '';
  absRedenen.forEach((r, i) => {
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--bg3);border:1px solid var(--line2);border-radius:var(--rsm)';
    row.innerHTML = `<span style="flex:1;font-size:12px;color:var(--text)">${r}</span>
      <button onclick="deleteReden(${i})" style="padding:3px 8px;background:transparent;border:1px solid var(--red);border-radius:4px;color:var(--red);font-size:11px;cursor:pointer">✕</button>`;
    cont.appendChild(row);
  });
}

function addReden() {
  const val = document.getElementById('new-reden-input').value.trim();
  if (!val || absRedenen.includes(val)) { showToast(val ? 'Bestaat al' : 'Vul een reden in'); return; }
  absRedenen.push(val);
  saveAbsRedenen(absRedenen);
  document.getElementById('new-reden-input').value = '';
  renderRedenList();
  showToast(val + ' toegevoegd');
}

function deleteReden(i) {
  if (!confirm('Verwijder reden "' + absRedenen[i] + '"?')) return;
  const naam = absRedenen[i];
  absRedenen.splice(i, 1);
  saveAbsRedenen(absRedenen);
  renderRedenList();
  showToast(naam + ' verwijderd');
}

// ─── SKILLS (bestaande functionaliteit) ───
// ─── SKILLS UIT FORMULIEREN ───
let spelerSkills = {}; // pid -> skills object

async function laadAlleFormulieren() {
  if (!supabaseReady) return;
  const res = await sbFetch('session_notes?note_key=like.formulier:*&select=note_key,content');
  if (!res || res._error) return;
  res.forEach(r => {
    const pid = r.note_key.replace('formulier:', '');
    try {
      const data = JSON.parse(r.content);
      if (data.skills) spelerSkills[pid] = data.skills;
    } catch(e) {}
  });
}

function renderTeamProfiel() {
  const cont = document.getElementById('profiel-content');
  // Combineer p.skills (oud) met spelerSkills uit formulieren (nieuw)
  const withSkills = sortedPlayers(players).filter(p =>
    (p.skills && Object.keys(p.skills).length > 0) || spelerSkills[p.id]
  );
  if (!withSkills.length) {
    cont.innerHTML = '<div style="font-size:12px;color:var(--text3)">Nog geen formulieren ingevuld door spelers.</div>';
    return;
  }
  const getSkills = p => ({ ...(p.skills || {}), ...(spelerSkills[p.id] || {}) });
  const total = withSkills.length;

  // Kleur per niveau
  const NK = {
    'Ontwikkel punt': { bg:'#FFEBEE', fill:'#C62828', text:'#C62828', label:'Ontwikkelpunt' },
    'Voldoende':      { bg:'#FFF3E0', fill:'#E65100', text:'#E65100', label:'Voldoende' },
    'Goed':           { bg:'#F1F8E9', fill:'#558B2F', text:'#558B2F', label:'Goed' },
    'Zeer goed':      { bg:'#E8F5E9', fill:'#1B5E20', text:'#1B5E20', label:'Zeer goed' },
  };

  let html = `<div style="font-size:11px;color:var(--text3);margin-bottom:14px">${withSkills.length} spelers met formulier</div>`;

  SKILL_CATS.forEach(sc => {
    html += `<div style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin:16px 0 8px;padding-top:12px;border-top:1px solid var(--border)">${sc.cat}</div>`;
    sc.skills.forEach(skill => {
      const counts = SKILL_LEVELS.map(lv => {
        const namen = withSkills.filter(p => getSkills(p)[skill] === lv).map(p => p.naam);
        return { lv, namen };
      }).filter(c => c.namen.length > 0);

      if (!counts.length) return;

      // Bepaal dominante niveau (meeste stemmen)
      const dominant = counts.reduce((a,b) => a.namen.length >= b.namen.length ? a : b);
      const nk = NK[dominant.lv] || NK['Voldoende'];
      const pct = Math.round((dominant.namen.length / total) * 100);
      const sid = 'sk-' + skill.replace(/\s+/g,'_');

      html += `<div style="margin-bottom:12px;cursor:pointer" onclick="toggleDetail('${sid}')">
        <div style="display:flex;align-items:center;gap:8px">
          <div style="font-size:12px;font-weight:500;color:var(--text);width:120px;flex-shrink:0">${skill}</div>
          <div style="flex:1;height:8px;background:var(--border);border-radius:100px;overflow:hidden">
            <div style="height:100%;width:${pct}%;background:${nk.fill};border-radius:100px;transition:width .3s"></div>
          </div>
          <div style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:100px;background:${nk.bg};color:${nk.text};border:1px solid ${nk.fill};flex-shrink:0;min-width:80px;text-align:center">${nk.label}</div>
        </div>
        <div id="${sid}" style="display:none;margin-top:6px;padding:8px 10px;background:var(--bg);border:1px solid var(--border);border-radius:var(--rsm)">
          ${SKILL_LEVELS.map(lv => {
            const c = counts.find(x => x.lv === lv);
            if (!c) return '';
            const nki = NK[lv];
            return `<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">
              <span style="font-size:10px;font-weight:700;padding:1px 7px;border-radius:100px;background:${nki.bg};color:${nki.text};border:1px solid ${nki.fill};flex-shrink:0">${nki.label}</span>
              <span style="font-size:11px;color:var(--text2)">${c.namen.join(', ')}</span>
            </div>`;
          }).join('')}
        </div>
      </div>`;
    });
  });
  cont.innerHTML = html;
}

function toggleDetail(id) {
  const el = document.getElementById(id);
  if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

async function onSupabaseReady() {
  const data = await loadFromSupabase();
  if (data.players)      { players      = data.players; }
  if (data.aanwezigheid) { aanwezigheid = data.aanwezigheid; }
  if (data.customWeken)  { customWeken  = data.customWeken; }
  if (data.absRedenen)   { absRedenen   = data.absRedenen; }
  if (data.teamConfig)   { const sub = document.getElementById('dashboard-sub'); if (sub) sub.textContent = data.teamConfig.subtitel || ''; }
  await laadAlleFormulieren();
  renderAanwOverzicht();
  renderTeamProfiel();
}

const cfg = loadTeamInstellingen(); const sub = document.getElementById('dashboard-sub'); if (sub) sub.textContent = cfg.subtitel || '';
renderAanwOverzicht();
renderTeamProfiel();
initScrollTop(); initManifest();
initSupabase().then(ok => { if (ok) onSupabaseReady(); });
</script>
</body>
</html>
