    'licht_blauw':{'--topbar':'#0D47A1','--topbar-dark':'#082f6e','--accent':'#1565C0','--bg':'#F0F4FF','--white':'#ffffff','--bg2':'#ffffff','--bg3':'#F0F4FF','--bg4':'#F0F4FF','--text':'#0D1B4A','--text2':'#2B4EA0','--text3':'#6B82CC','--border':'#C7D4FC','--border2':'#A8BCFA','--line':'#C7D4FC','--line2':'#A8BCFA','--red':'#D32F2F','--field-bg':'#1B5E20','--field-border':'#2E7D32','--font-ui':"'DM Sans',sans-serif",'--font-mono':"'DM Mono',monospace",'--font-display':"'DM Sans',sans-serif",'--r':'14px','--rsm':'10px','--badge-radius':'100px','--card-shadow':'0 1px 3px rgba(0,0,0,.06)'},
    'fcp':{'--topbar':'#1a1a1a','--topbar-dark':'#000000','--accent':'#F5C000','--bg':'#111111','--white':'#1e1e1e','--bg2':'#1e1e1e','--bg3':'#111111','--bg4':'#111111','--text':'#F5F5F5','--text2':'#CCCCCC','--text3':'#888888','--border':'#333333','--border2':'#444444','--line':'#333333','--line2':'#444444','--red':'#ff4444','--field-bg':'#1B5E20','--field-border':'#2E7D32','--font-ui':"'DM Sans',sans-serif",'--font-mono':"'DM Mono',monospace",'--font-display':"'DM Sans',sans-serif",'--r':'14px','--rsm':'10px','--badge-radius':'100px','--card-shadow':'none'},
    'donker':{'--topbar':'#080c14','--topbar-dark':'#030508','--accent':'#c8a840','--bg':'#080c14','--white':'#0e1524','--bg2':'#0e1524','--bg3':'#121b2e','--bg4':'#1a2540','--text':'#e8eef8','--text2':'#9aaccc','--text3':'#5a7090','--border':'#1e2e48','--border2':'#2a3e5c','--line':'#141e30','--line2':'#1e2e48','--red':'#f05050','--field-bg':'#0a1828','--field-border':'#1a3050','--font-ui':"'DM Sans',sans-serif",'--font-mono':"'DM Mono',monospace",'--font-display':"'DM Sans',sans-serif",'--r':'14px','--rsm':'10px','--badge-radius':'100px','--card-shadow':'none'}
  };
  const k=localStorage.getItem('fcp_thema')||'licht';
  const m=T[k]||T.licht;
  const r=document.documentElement.style;
  Object.entries(m).forEach(([p,v])=>r.setProperty(p,v));
})();
</script>
</head>

<div class="scroll-top" id="scrollTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</div>
<div class="toast" id="toast"></div>

<div class="page-wrap">
  <div class="page-header">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <div class="page-title">Selectie</div>
      <button class="topbar-btn" onclick="toggleNieuweSpeler()">+ Speler</button>
    </div>
  </div>
  <div class="form-wrap" style="padding-top:12px;padding-bottom:calc(120px + env(safe-area-inset-bottom))">
    <div class="add-form" id="nieuwe-speler-form" style="display:none">
      <div class="form-title">+ Nieuwe speler</div>
      <div class="form-row">
        <input class="form-input" id="input-naam" placeholder="Naam speler" type="text" maxlength="30">
      </div>
      <div class="form-row">
        <button class="form-btn" onclick="addPlayer()" style="width:100%">Toevoegen</button>
      </div>
    </div>
    <div id="player-list"><div style="font-size:12px;color:var(--text3)">Nog geen spelers.</div></div>
  </div>
</div>

<script src="app.js"></script>
<script>
let players = loadState().players;

function toggleNieuweSpeler() {
  const f = document.getElementById('nieuwe-speler-form');
  if (f) f.style.display = f.style.display === 'none' ? 'block' : 'none';
}

async function addPlayer() {
  if (!naam) { showToast('Vul een naam in'); return; }
  const p = { id:genId(), naam, omschrijving:'', posities:[], opmerkingen:'', ontwikkeling:'', skills:null };
  if (supabaseReady) {
    const res = await sbFetch('players', 'POST', { id:p.id, naam:p.naam, omschrijving:p.omschrijving, posities:p.posities, opmerkingen:p.opmerkingen, ontwikkeling:p.ontwikkeling });
    if (!res || res._error) { showToast('Opslaan mislukt'); return; }
  }
  players.push(p);
  savePlayers(players);
  renderPlayerList();
  document.getElementById('input-naam').value = '';
  showToast(naam + ' toegevoegd');
}

async function deletePlayer(id) {
  const p = players.find(pl => pl.id === id);
  if (!confirm('Verwijder ' + (p ? p.naam : 'speler') + '?')) return;
  players = players.filter(pl => pl.id !== id);
  const lineup = loadState().lineup;
  Object.keys(lineup).forEach(k => { if (lineup[k] === id) delete lineup[k]; });
  savePlayers(players);
  saveLineup(lineup);
  if (supabaseReady) await sbFetch('players?id=eq.' + id, 'DELETE');
  renderPlayerList();
  showToast('Speler verwijderd');
}

async function savePlayerData(id) {
  const p = players.find(pl => pl.id === id); if (!p) return;
  p.omschrijving  = document.getElementById('omschr-' + id).value;
  p.opmerkingen   = document.getElementById('opm-' + id).value;
  p.ontwikkeling  = document.getElementById('ontw-' + id).value;
  savePlayers(players);
  if (supabaseReady) await sbFetch('players?id=eq.' + id, 'PATCH', { omschrijving:p.omschrijving, opmerkingen:p.opmerkingen, ontwikkeling:p.ontwikkeling });
  showToast(p.naam + ' opgeslagen');
}

function togglePosTag(pid, pos, el) {
  const p = players.find(pl => pl.id === pid); if (!p) return;
  if (!p.posities) p.posities = [];
  if (el.classList.contains('active')) { p.posities = p.posities.filter(x => x !== pos); el.classList.remove('active'); }
  else { p.posities.push(pos); el.classList.add('active'); }
  savePlayers(players);
  if (supabaseReady) sbFetch('players?id=eq.' + pid, 'PATCH', { posities: p.posities });
}

function deelSpelerFormulier(pid, naam) { deelFormulier(pid, naam); }

async function wisFormulier(pid) {
  if (!confirm('Formulier van deze speler wissen?')) return;
  if (supabaseReady) {
    await sbFetch('session_notes?note_key=eq.formulier:' + pid, 'DELETE');
  }
  // Verwijder ook uit cache
  delete formulierCache[pid];
  // Herrender de formuliersectie
  const el = document.getElementById('formulier-' + pid);
  if (el) el.innerHTML = '<div style="font-size:11px;color:var(--text3);padding:4px 0">Nog niet ingevuld</div>';
  showToast('Formulier gewist');
}

// Formulier delen
function deelFormulier(pid, naam) {
  const base = location.origin + location.pathname.replace('selectie.html','') + 'spelerformulier.html?token=';
  const token = safeEncode(pid + ':' + naam);
  // Voeg sb_url en sb_key toe zodat speler kan opslaan
  const sbUrl = localStorage.getItem('sb_url') || '';
  const sbKey = localStorage.getItem('sb_key') || '';
  let url = base + encodeURIComponent(token);
  if (sbUrl) url += '&su=' + encodeURIComponent(safeEncode(sbUrl));
  if (sbKey) url += '&sk=' + encodeURIComponent(safeEncode(sbKey));
  if (navigator.share) {
    navigator.share({ title:'Spelersformulier ' + naam, text:'Vul je formulier in voor FCP 16-2', url });
  } else {
    navigator.clipboard?.writeText(url).then(() => showToast('Link gekopieerd voor ' + naam));
  }
}

// Formulierresultaat tonen per speler
const formulierCache = {};
async function laadFormulierData(pid) {
  if (formulierCache[pid] !== undefined) return formulierCache[pid];
  if (!supabaseReady) return null;
  const res = await sbFetch('session_notes?note_key=eq.formulier:' + pid + '&select=content');
  if (res && !res._error && res.length) {
    try { formulierCache[pid] = JSON.parse(res[0].content); return formulierCache[pid]; }
    catch(e) {}
  }
  formulierCache[pid] = null;
  return null;
}

async function renderFormulierData(pid) {
  const el = document.getElementById('formulier-' + pid);
  if (!el) return;
  const data = await laadFormulierData(pid);
  if (!data) {
    el.innerHTML = '<div style="font-size:11px;color:var(--text3);padding:4px 0">Nog niet ingevuld</div>';
    return;
  }
  const datum = data.ingestuurd_op ? new Date(data.ingestuurd_op).toLocaleDateString('nl-NL') : '';
  let html = `<div style="font-size:10px;color:var(--accent);margin-bottom:8px">✓ Ingevuld${datum ? ' op ' + datum : ''}</div>`;
  // Persoonlijke info
  const infos = [
    data.geboortedatum && ['Geboortedatum', data.geboortedatum],
    data.positie       && ['Positie',        data.positie],
    data.mobiel        && ['Mobiel',          data.mobiel],
    data.vakantie === 'ja' && ['Vakantie',    (data.vakantie_van||'?') + ' t/m ' + (data.vakantie_tot||'?')],
    data.aanvoerder    && ['Aanvoerder',      data.aanvoerder === 'ja' ? 'Ja — ' + (data.aanvoerder_waarom||'') : 'Nee, kiest ' + (data.aanvoerder_wie||'')],
  ].filter(Boolean);
  if (infos.length) {
    html += '<div style="display:flex;flex-direction:column;gap:4px;margin-bottom:8px">';
    infos.forEach(([k,v]) => html += `<div style="font-size:11px"><span style="color:var(--text3)">${k}: </span><span style="color:var(--text2)">${v}</span></div>`);
    html += '</div>';
  }
  // Skills per categorie
  const FORM_SKILLS = {
    Techniek: ['Balcontrole','Dribbel','Passen van de bal','Schieten op doel'],
    Tactiek:  ['Positiespel','Inzicht','Teamplayer'],
    Fysiek:   ['Conditie','Explosieve kracht','Duel kracht'],
    Mentaal:  ['Gedrag','Motivatie','Aandacht','Discipline','Omgaan met tegenslag'],
  };
  const kleur = {'Ontwikkel punt':'#C62828','Voldoende':'#E65100','Goed':'#558B2F','Zeer goed':'#1B5E20'};
  if (data.skills && Object.keys(data.skills).length) {
    Object.entries(FORM_SKILLS).forEach(([cat, skills]) => {
      const catSkills = skills.filter(s => data.skills[s]);
      if (!catSkills.length) return;
      html += `<div style="font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin:6px 0 3px">${cat}</div>`;
      html += '<div style="display:flex;flex-direction:column;gap:3px">';
      catSkills.forEach(s => {
        const v = data.skills[s];
        html += `<div style="display:flex;justify-content:space-between;align-items:center;font-size:11px">
          <span style="color:var(--text2)">${s}</span>
          <span style="padding:1px 7px;border-radius:10px;background:${kleur[v]||'var(--bg3)'};color:#fff;font-size:10px">${v}</span>
        </div>`;
      });
      html += '</div>';
    });
  }
  if (data.wens) html += `<div style="margin-top:8px;font-size:11px"><div style="color:var(--text3);margin-bottom:3px">Wens dit seizoen</div><div style="color:var(--text2);line-height:1.5">${data.wens}</div></div>`;
  if (data.bijzonderheden) html += `<div style="margin-top:6px;font-size:11px"><div style="color:var(--text3);margin-bottom:3px">Bijzonderheden</div><div style="color:var(--text2)">${data.bijzonderheden}</div></div>`;
  el.innerHTML = html;
}


function renderPlayerList() {
  const list = document.getElementById('player-list');
  if (!players.length) { list.innerHTML = '<div style="font-size:12px;color:var(--text3)">Nog geen spelers.</div>'; return; }
  list.innerHTML = '';
  sortedPlayers(players).forEach(p => {
    const card = document.createElement('div');
    card.className = 'card';
    card.id = 'pcard-' + p.id;
    const posTagsHtml = ALL_POS_OPTS.map(pos => {
      const active = p.posities && p.posities.includes(pos) ? ' active' : '';
      return `<span class="pos-tag${active}" onclick="togglePosTag('${p.id}','${pos}',this)">${pos}</span>`;
    }).join('');
    card.innerHTML = `
      <div class="card-hdr" onclick="this.closest('.card').classList.toggle('open'); if(this.closest('.card').classList.contains('open')) renderFormulierData('${p.id}')">
        <div style="width:28px;height:28px;border-radius:50%;background:var(--bg3);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0">⚽</div>
        <div class="card-info">
          <div class="card-title">${p.naam}</div>
          <div class="card-sub">${p.omschrijving || 'Geen omschrijving'}</div>
        </div>
        <span class="card-chev">▾</span>
      </div>
      <div class="card-body">
        <div class="player-section">Omschrijving</div>
        <input class="player-input" id="omschr-${p.id}" placeholder="Bijv: snelle back..." value="${(p.omschrijving||'').replace(/"/g,'&quot;')}">
        <div class="player-section">Posities</div>
        <div class="pos-tags">${posTagsHtml}</div>
        <div class="player-section">Eigenschappen / aantekeningen</div>
        <textarea class="player-textarea" id="opm-${p.id}" placeholder="Sterktes, aandachtspunten...">${p.opmerkingen||''}</textarea>
        <div class="player-section">Ontwikkeling gedurende seizoen</div>
        <textarea class="player-textarea" id="ontw-${p.id}" placeholder="Week 5 — positiespel gaat beter...">${p.ontwikkeling||''}</textarea>
        <div class="player-section" style="display:flex;justify-content:space-between;align-items:center">
          <span>Spelersformulier</span>
          <span style="display:inline-flex;gap:6px">
            <button onclick="deelFormulier('${p.id}',decodeURIComponent('${encodeURIComponent(p.naam)}'))" style="padding:3px 10px;background:transparent;border:1px solid var(--accent);border-radius:12px;color:var(--accent);font-size:11px;cursor:pointer;font-family:var(--font-mono)">📲 Deel</button>
            <button onclick="wisFormulier('${p.id}')" style="padding:3px 10px;background:transparent;border:1px solid var(--red);border-radius:12px;color:var(--red);font-size:11px;cursor:pointer;font-family:var(--font-mono)" id="wisknop-${p.id}">✕ Wis</button>
          </span>
        </div>
        <div id="formulier-${p.id}" style="margin:4px 0 8px"></div>
        <div class="player-actions">
          <button class="save-btn" onclick="savePlayerData('${p.id}')">💾 Opslaan</button>
          <button class="del-btn" onclick="deletePlayer('${p.id}')">Verwijder</button>
        </div>
      </div>`;
    list.appendChild(card);
  });
}

async function onSupabaseReady() {
  const data = await loadFromSupabase();
  if (data.players) players = data.players;
  renderPlayerList();
}

renderPlayerList();
initScrollTop();
initManifest();
initSupabase().then(ok => { if (ok) onSupabaseReady(); });
</script>
</body>
