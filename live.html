const THEMA_MEDIA = window.matchMedia('(prefers-color-scheme: dark)');
function pasThemaToe() {
  const modus = localStorage.getItem('fcp_thema_v2') || 'systeem';
  const effectief = modus === 'systeem' ? (THEMA_MEDIA.matches ? 'donker' : 'licht') : modus;
  document.documentElement.setAttribute('data-thema', effectief);
}
THEMA_MEDIA.addEventListener('change', pasThemaToe);
pasThemaToe();

async function sbGet(path) {
  try {
    const r = await fetch(SB_URL + '/rest/v1/' + path, { headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY } });
    if (!r.ok) return [];
    return await r.json();

}

function statusChip(w) {
  if (w.status === 'live_1e' || w.status === 'live_2e') {
    const min = live_minuut(w);
    const helftTxt = w.status === 'live_1e' ? '1e' : '2e';
    return `<span style="display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700"><span class="livedot"></span>${min}' · ${helftTxt}</span>`;
  }
  if (w.status === 'rust') return `<span class="tag tag--line">RUST</span>`;
  if (w.status === 'ft')   return `<span class="tag tag--line">FT</span>`;
  return '';
}

function live_minuut(w) {
  if (!w.helft_start) return w.minuut_offset || 0;
  const verstreken = Math.floor((Date.now() - new Date(w.helft_start).getTime()) / 60000);
  return (w.minuut_offset||0) + Math.max(0, verstreken);
}

function statusTekstDetail(w) {
  if (w.status === 'live_1e') return live_minuut(w) + "' · 1e helft";
  if (w.status === 'live_2e') return live_minuut(w) + "' · 2e helft";
  if (w.status === 'rust')    return 'Rust';
  if (w.status === 'ft')      return 'Afgelopen';
  return w.datum + (w.starttijd ? ' · ' + w.starttijd : '');
}

function teamNamen(w) {
  const wij = 'FCP 16-2';
  return w.thuis_uit === 'uit' ? [w.tegenstander, wij] : [wij, w.tegenstander];
}

const TYPE_LABEL = {
  start_1e: 'Wedstrijd gestart',
  rust: 'Rust',
  start_2e: '2e helft gestart',
  einde: 'Einde wedstrijd',
};

function renderTijdlijnItem(u) {
  const tekst = u.type === 'update' ? (u.tekst || 'Update') : (TYPE_LABEL[u.type] || u.tekst || u.type);
  const toonStand = u.type === 'update' && u.score_eigen !== null && u.score_eigen !== undefined;
  const standTxt = toonStand ? ` (${u.score_eigen}-${u.score_tegen})` : '';
  const minTxt = u.wedstrijd_minuut !== null && u.wedstrijd_minuut !== undefined ? u.wedstrijd_minuut + "'" : '';
  return `<div class="note" style="margin-bottom:8px">
    <div class="note-t">${minTxt}</div>
    <div class="note-tx">${tekst}${standTxt}</div>
  </div>`;
}

// Zelfde rolkleur-indeling als fieldRoleClassV2() in prototype-v2.html (die dit
// bestand niet laadt — zie de kop van dit bestand voor waarom).
function fieldRoleClass(label) {
  if (label === 'GK') return 'rol-keeper';
  if (/^(LB|RB|CB|LWB|RWB|DEF|ACHT)/.test(label)) return 'rol-verdediger';
  if (/^(ST|CF|LW|RW|AANV|VOOR)/.test(label)) return 'rol-aanval';
  return 'rol-midden';
}

function renderMiniField(w) {
  const posities = FORMATIES[w.formatie];
  if (!posities || !w.opstelling || !w.opstelling.length) return '';
  const namenPerPos = {};
  w.opstelling.forEach(o => { namenPerPos[o.pos] = o.naam; });
  const slots = posities.map(p => {
    const naam = namenPerPos[p.label] || namenPerPos[p.id];
    if (!naam) return '';
    return `<div class="fslot" style="left:${p.x}%;top:${p.y}%">
      <div class="ppill"><span class="ppill-rol ${fieldRoleClass(p.label)}">${p.label}</span><span class="ppill-nm">${naam.split(' ')[0]}</span></div>
    </div>`;
  }).join('');
  return `<div class="card" style="margin-top:10px">
    <div class="sec">Basisopstelling${w.formatie ? ' · ' + (FORMATIE_LABELS[w.formatie] || w.formatie) : ''}</div>
    <div class="pitch" style="height:320px">${slots}</div>
  </div>`;
}

// Zelfde indeling-logica als de coach-pagina (wedstrijden.html: wedCategorie()), zodat
// ouders exact dezelfde volgorde/groepen zien als in de app zelf.
function wedCategorie(w) {
  if (w.status === 'ft') return 'gespeeld';
  const nu = new Date(); nu.setHours(0,0,0,0);
  const d = w.iso_date ? new Date(w.iso_date) : null;
  if (!d) return 'toekomst';
  const diff = d - nu;
  if (diff < 0) return 'volgend'; // datum voorbij maar niet bevestigd afgerond
  if (diff < 7 * 24 * 60 * 60 * 1000) return 'volgend';
  return 'toekomst';
}

function trainerLinkIcon(groot) {
  if (!heeftTrainerToegang()) return '';
  const maat = groot ? '34px' : '28px';
  return `<a href="index.html" title="Naar de trainersapp" class="btn btn--secondary btn--icon" style="width:${maat};height:${maat};flex-shrink:0">🏠</a>`;
}

async function renderOverzicht() {
  const app = document.getElementById('app');
  const wedstrijden = await sbGet('live_wedstrijden?select=*&order=iso_date.asc');

  const kaart = w => {
    const [thuis, uit] = teamNamen(w);
    return `<a class="row" href="?wedstrijd=${w.id}" style="text-decoration:none;border-radius:var(--r-card);box-shadow:var(--sh1);margin-bottom:8px">
      <div class="pub-card-left">
        <div class="row-title">${thuis} – ${uit}</div>
        <div class="row-sub">${w.datum}${w.starttijd ? ' · ' + w.starttijd : ''}</div>
      </div>
      <div class="pub-right">
        <div class="pub-score num">${w.score_eigen}–${w.score_tegen}</div>
        ${statusChip(w)}
      </div>
    </a>`;
  };

  let html = `
    <div class="appbar pub-appbar">
      <div><div class="appbar-h1">FCP 16-2</div><div class="appbar-sub">Live wedstrijdvolgen · seizoen 2026/2027</div></div>
      ${trainerLinkIcon(true)}
    </div>
    <div class="pub-list">`;

  if (!wedstrijden.length) {
    html += `<div class="empty">Nog geen wedstrijden om te volgen.</div>`;
  } else {
    const volgend  = wedstrijden.filter(w => wedCategorie(w) === 'volgend');
    const toekomst = wedstrijden.filter(w => wedCategorie(w) === 'toekomst');
    const gespeeld = wedstrijden.filter(w => wedCategorie(w) === 'gespeeld')
      .sort((a,b) => (b.iso_date+b.starttijd).localeCompare(a.iso_date+a.starttijd)); // nieuwste eerst

    if (volgend.length)  html += `<div class="sec" style="margin-top:4px">Eerstvolgende</div>` + volgend.map(kaart).join('');
    if (toekomst.length) html += `<div class="sec" style="margin-top:14px">Toekomstige wedstrijden</div>` + toekomst.map(kaart).join('');
    if (gespeeld.length) html += `<div class="sec" style="margin-top:14px">Gespeeld</div>` + gespeeld.map(kaart).join('');
  }
  html += `</div>`;
  app.innerHTML = html;
}

// Vaste systemen staan hierboven hardcoded; een zelfgemaakt (sleepbaar) systeem
// staat in de custom_formaties-tabel en wordt hier lazy opgehaald zodra een
// wedstrijd er een blijkt te gebruiken — één keer per formatie-key, daarna
// zit 'm al in FORMATIES/FORMATIE_LABELS voor de rest van de sessie (incl. de
// 8-seconden-polling hieronder).
async function laadCustomFormatieIndienNodig(w) {
  if (!w.formatie || FORMATIES[w.formatie]) return;
  const [f] = await sbGet('custom_formaties?select=*&id=eq.' + encodeURIComponent(w.formatie));
  if (!f) return;
  const posities = typeof f.posities === 'string' ? JSON.parse(f.posities || '[]') : (f.posities || []);
  FORMATIES[w.formatie] = posities.map(p => ({ id: p.id, label: p.id.replace(/_/g, '-'), x: p.x, y: p.y }));
  FORMATIE_LABELS[w.formatie] = f.titel;
}

async function renderDetail(id) {
  const app = document.getElementById('app');
  const [w] = await sbGet('live_wedstrijden?select=*&id=eq.' + encodeURIComponent(id));
  if (!w) { app.innerHTML = `<div class="empty">Wedstrijd niet gevonden.<br><a href="live.html">← Terug naar overzicht</a></div>`; return; }
  await laadCustomFormatieIndienNodig(w);
  const updates = await sbGet('live_updates?select=*&wedstrijd_id=eq.' + encodeURIComponent(id) + '&order=created_at.desc');
  const [thuis, uit] = teamNamen(w);
  const isLive = w.status === 'live_1e' || w.status === 'live_2e';

  app.innerHTML = `
    <div class="appbar pub-appbar" style="display:block">
      <div class="pub-back-row">
        <a class="btn btn--ghost btn--sm" href="live.html">← Alle wedstrijden</a>
        ${trainerLinkIcon(false)}
      </div>
    </div>
    <div class="pub-list">
      <div class="card">
        <div class="pub-teams">
          <div class="pub-team">${thuis}</div>
          <div class="pub-score-big num">${w.score_eigen}–${w.score_tegen}</div>
          <div class="pub-team uit">${uit}</div>
        </div>
        <div class="pub-status-row">
          ${isLive ? '<span class="livedot"></span>' : ''}
          <span class="pub-status-txt">${statusTekstDetail(w)}</span>
        </div>
      </div>
      <div class="card" style="margin-top:10px">
        <div class="sec">Verloop</div>
        ${updates.length ? updates.map(renderTijdlijnItem).join('') : `<div style="font-size:13px;color:var(--ink3)">Nog geen updates.</div>`}
      </div>
      ${renderMiniField(w)}
    </div>
  `;
}

async function render() {
  const params = new URLSearchParams(location.search);
  const id = params.get('wedstrijd');
  if (id) await renderDetail(id);
  else await renderOverzicht();
}

render();
setInterval(render, 8000); // eenvoudige polling, elke 8 seconden verse data
</script>
</body>
</html>
