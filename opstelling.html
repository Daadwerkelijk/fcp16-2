<!-- Modal: speler kiezen -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-title" id="modal-title">Kies speler</div>
    <div class="modal-sub" id="modal-sub"></div>
    <div class="modal-list" id="modal-list"></div>
    <button class="modal-cancel" onclick="closeModal()">Annuleer</button>
  </div>

<script src="app.js"></script>
<script>
const state = loadState();
let players  = state.players;
let lineup   = state.lineup;
let activeFormatie = state.formatie;
let currentPosId = null;

function renderFormatieDropdown() {
  FORMATIES = loadFormaties();
  const sel = document.getElementById('formatie-select');
  sel.innerHTML = '';
  Object.entries(FORMATIES).forEach(([key, f]) => {
    const opt = document.createElement('option');
    opt.value = key;
    opt.textContent = f.label;
    opt.selected = key === activeFormatie;
    sel.appendChild(opt);
  });
}

function setFormatie(f) {
  activeFormatie = f;
  localStorage.setItem('fcp_formatie', f);
  const sel = document.getElementById('formatie-select');
  if (sel) sel.value = f;
  buildField();
}

function getPositions() { return FORMATIES[activeFormatie].pos; }

function buildField() {
  const cont = document.getElementById('fieldPositions');
  cont.innerHTML = '';
  getPositions().forEach(pos => {
    const slot = document.createElement('div');
    slot.className = 'pos-slot'; slot.id = 'slot-' + pos.id;
    slot.style.left = pos.x + '%'; slot.style.top = pos.y + '%';
    slot.onclick = () => openModal(pos);
    const pill  = document.createElement('div'); pill.className = 'pos-pill'; pill.id = 'pill-' + pos.id;
    const rol   = document.createElement('span'); rol.className = 'pos-pill-rol ' + fieldRoleClass(pos.label); rol.textContent = pos.label;
    const name  = document.createElement('span'); name.className = 'pos-pill-naam'; name.id = 'name-' + pos.id;
    pill.appendChild(rol); pill.appendChild(name);
    slot.appendChild(pill);
    cont.appendChild(slot);
  });
  renderLineup();
}

function renderLineup() {
  getPositions().forEach(pos => {
    const pid     = lineup[pos.id];
    const nameEl  = document.getElementById('name-' + pos.id);
    if (!nameEl) return;
    if (pid != null) {
      const p = players.find(pl => pl.id === pid);
      if (p) {
        const parts = p.naam.trim().split(' ');
        nameEl.textContent = parts[0];
        return;
      }
    }
    nameEl.textContent = '';
  });
  renderBench();
}

function renderBench() {
  const benchList = document.getElementById('bench-list');
  const benchCount = document.getElementById('bench-count');
  if (!benchList) return;
  const opgesteld = new Set(Object.values(lineup).filter(Boolean));
  const wisselspelers = players.filter(p => !opgesteld.has(p.id));
  if (benchCount) benchCount.textContent = wisselspelers.length + ' spelers';
  if (!wisselspelers.length) {
    benchList.innerHTML = '<div style="font-size:12px;color:var(--text3);padding:4px 0">Alle spelers zijn opgesteld.</div>';
    return;
  }
  benchList.innerHTML = wisselspelers.map(p => {
    const parts = p.naam.trim().split(' ');
    const init = parts.length > 1 ? (parts[0][0] + parts[parts.length-1][0]).toUpperCase() : p.naam.slice(0,2).toUpperCase();
    const badges = getRolBadges(p.posities);
    return `<div style="display:flex;align-items:center;gap:10px;background:var(--white);border:1px solid var(--border);border-radius:var(--rsm);padding:9px 12px;margin-bottom:6px">
      <div style="width:32px;height:32px;border-radius:50%;background:var(--bg);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--text);flex-shrink:0">${init}</div>
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.naam}</div>
        <div style="display:flex;gap:4px;margin-top:3px;flex-wrap:wrap">${badges || `<span style="font-size:10px;color:var(--text3)">Geen positie</span>`}</div>
      </div>
    </div>`;
  }).join('');
}

function openModal(pos) {
  currentPosId = pos.id;
  document.getElementById('modal-title').textContent = pos.label;
  document.getElementById('modal-sub').textContent   = POS_LABELS[pos.role] + ' — kies een speler';
  const list = document.getElementById('modal-list'); list.innerHTML = '';
  const emptyBtn = document.createElement('button');
  emptyBtn.className = 'modal-btn';
  emptyBtn.textContent = '— Positie leeg laten';
  emptyBtn.onclick = () => { assign(pos.id, null); closeModal(); };
  list.appendChild(emptyBtn);
  if (!players.length) {
    const d = document.createElement('div');
    d.style.cssText = 'font-size:12px;color:var(--text3);padding:8px 0';
    d.textContent = 'Geen spelers. Voeg toe via Selectie.';
    list.appendChild(d);
  } else {
    // Sorteer: passende positie eerst, dan nog-niet-opgestelde spelers, dan de rest
    const { matched, onbezet, bezet } = splitSpelersVoorPositie(players, pos, lineup, getPositions().map(ps => ps.id));

    const addGroup = (arr, label) => {
      if (!arr.length) return;
      if (label) {
        const hdr = document.createElement('div');
        hdr.style.cssText = 'font-size:10px;color:var(--accent);text-transform:uppercase;letter-spacing:.07em;padding:4px 0 6px';
        hdr.textContent = label;
        list.appendChild(hdr);
      } else {
        const sep = document.createElement('div');
        sep.style.cssText = 'border-top:1px solid var(--line2);margin:6px 0';
        list.appendChild(sep);
      }
      arr.forEach(p => addPlayerBtn(list, p, pos, lineup));
    };
    addGroup(matched, 'Passende positie');
    addGroup(onbezet, null);
    addGroup(bezet, null);
  }
  document.getElementById('modalOverlay').classList.add('open');
}

function addPlayerBtn(list, p, pos, lineup) {
  const btn = document.createElement('button');
  const assignedTo = vindHuidigeToewijzing(p.id, lineup, getPositions().map(ps => ps.id), pos.id);
  const assignedLabel = assignedTo ? getPositions().find(ps => ps.id === assignedTo[0])?.label : '';
  btn.className = 'modal-btn' + (lineup[pos.id] === p.id ? ' current' : '');
  btn.innerHTML = `<span>${p.naam}</span><span style="font-size:11px;color:var(--text3)">${lineup[pos.id]===p.id?'✓ Huidig':assignedLabel?'⟵ '+assignedLabel:''}</span>`;
  btn.onclick = () => {
    if (assignedTo && lineup[pos.id] !== p.id) {
      // Verplaats: maak oude positie leeg, zet op nieuwe
      lineup[assignedTo[0]] = null;
      saveLineup(lineup);
    }
    assign(pos.id, p.id); closeModal();
  };
  list.appendChild(btn);
}

async function assign(posId, playerId) {
  lineup[posId] = playerId;
  saveLineup(lineup);
  renderLineup();
  if (supabaseReady) await assignLineupPositie(posId, playerId);
  const pos = getPositions().find(ps => ps.id === posId);
  const p   = players.find(pl => pl.id === playerId);
  showToast(p ? p.naam + ' → ' + pos?.label : 'Positie leeggemaakt');
}

function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }

function clearLineup() {
  if (!confirm('Wis de volledige opstelling?')) return;
  lineup = {}; saveLineup(lineup); renderLineup();
  if (supabaseReady) clearLineupRemote();
  showToast('Opstelling gewist');
}

function shareWhatsApp() {
  const f = FORMATIES[activeFormatie];
  let tekst = '⚽ FCP 16-2 — Opstelling ' + f.label + '\n\n';
  f.pos.forEach(pos => {
    const p = players.find(pl => pl.id === lineup[pos.id]);
    tekst += pos.label + ': ' + (p ? p.naam : '—') + '\n';
  });
  window.open('https://wa.me/?text=' + encodeURIComponent(tekst), '_blank');
}

function saveLineupAction() {
  saveLineup(lineup);
  const f = getPositions().filter(p => lineup[p.id] != null).length;
  showToast('Opgeslagen · ' + f + '/11 posities');
}

async function onSupabaseReady() {
  const data = await loadFromSupabase();
  if (data.players) players = data.players;
  if (data.lineup)  lineup  = data.lineup;
  buildField(); // opnieuw opbouwen zodat spelersnamen correct staan
}

// Init
FORMATIES = loadFormaties();
if (!FORMATIES[activeFormatie]) activeFormatie = Object.keys(FORMATIES)[0];
renderFormatieDropdown();
buildField();
initScrollTop();
initManifest();
initSupabase().then(ok => { if (ok) onSupabaseReady(); });
</script>
</body>
