<script>
(function(){
  const T={
    'licht':{'--topbar':'#2B1FA0','--topbar-dark':'#1a1262','--accent':'#2B1FA0','--bg':'#F2F1FF','--white':'#ffffff','--bg2':'#ffffff','--bg3':'#F2F1FF','--bg4':'#F2F1FF','--text':'#12113A','--text2':'#4A4870','--text3':'#8B8AB0','--border':'#E4E3F5','--border2':'#D0CFED','--line':'#E4E3F5','--line2':'#D0CFED','--red':'#D32F2F','--field-bg':'#1B5E20','--field-border':'#2E7D32','--font-ui':"'DM Sans',sans-serif",'--font-mono':"'DM Mono',monospace",'--font-display':"'DM Sans',sans-serif",'--r':'14px','--rsm':'10px','--badge-radius':'100px','--card-shadow':'0 1px 3px rgba(0,0,0,.06)'},
    'licht_groen':{'--topbar':'#1B5E20','--topbar-dark':'#0D3B12','--accent':'#1B7A4B','--bg':'#F1F8F4','--white':'#ffffff','--bg2':'#ffffff','--bg3':'#F1F8F4','--bg4':'#F1F8F4','--text':'#0D2B14','--text2':'#2E6645','--text3':'#6B9E7A','--border':'#D4EBD9','--border2':'#B8DABD','--line':'#D4EBD9','--line2':'#B8DABD','--red':'#D32F2F','--field-bg':'#1B5E20','--field-border':'#2E7D32','--font-ui':"'DM Sans',sans-serif",'--font-mono':"'DM Mono',monospace",'--font-display':"'DM Sans',sans-serif",'--r':'14px','--rsm':'10px','--badge-radius':'100px','--card-shadow':'0 1px 3px rgba(0,0,0,.06)'},
    'licht_blauw':{'--topbar':'#0D47A1','--topbar-dark':'#082f6e','--accent':'#1565C0','--bg':'#F0F4FF','--white':'#ffffff','--bg2':'#ffffff','--bg3':'#F0F4FF','--bg4':'#F0F4FF','--text':'#0D1B4A','--text2':'#2B4EA0','--text3':'#6B82CC','--border':'#C7D4FC','--border2':'#A8BCFA','--line':'#C7D4FC','--line2':'#A8BCFA','--red':'#D32F2F','--field-bg':'#1B5E20','--field-border':'#2E7D32','--font-ui':"'DM Sans',sans-serif",'--font-mono':"'DM Mono',monospace",'--font-display':"'DM Sans',sans-serif",'--r':'14px','--rsm':'10px','--badge-radius':'100px','--card-shadow':'0 1px 3px rgba(0,0,0,.06)'},
    'fcp':{'--topbar':'#1a1a1a','--topbar-dark':'#000000','--accent':'#F5C000','--bg':'#111111','--white':'#1e1e1e','--bg2':'#1e1e1e','--bg3':'#111111','--bg4':'#111111','--text':'#F5F5F5','--text2':'#CCCCCC','--text3':'#888888','--border':'#333333','--border2':'#444444','--line':'#333333','--line2':'#444444','--red':'#ff4444','--field-bg':'#1B5E20','--field-border':'#2E7D32','--font-ui':"'DM Sans',sans-serif",'--font-mono':"'DM Mono',monospace",'--font-display':"'DM Sans',sans-serif",'--r':'14px','--rsm':'10px','--badge-radius':'100px','--card-shadow':'none'},
    'donker':{'--topbar':'#080c14','--topbar-dark':'#030508','--accent':'#c8a840','--bg':'#080c14','--white':'#0e1524','--bg2':'#0e1524','--bg3':'#121b2e','--bg4':'#1a2540','--text':'#e8eef8','--text2':'#9aaccc','--text3':'#5a7090','--border':'#1e2e48','--border2':'#2a3e5c','--line':'#141e30','--line2':'#1e2e48','--red':'#f05050','--field-bg':'#0a1828','--field-border':'#1a3050','--font-ui':"'DM Sans',sans-serif",'--font-mono':"'DM Mono',monospace",'--font-display':"'DM Sans',sans-serif",'--r':'14px','--rsm':'10px','--badge-radius':'100px','--card-shadow':'none'}
  };
  const k=localStorage.getItem('fcp_thema')||'licht';
  const m=T[k]||T.licht;
  const r=document.documentElement.style;
  Object.entries(m).forEach(([p,v])=>r.setProperty(p,v));
})();

let rankingSortMode = 'alfa';
let rankingActiveType = 'alle';
let rankingActiveFases = new Set();
let wedstrijdenData = JSON.parse(localStorage.getItem('fcp_wed') || '[]');

function onRankingTypeChange() {
  rankingActiveType = document.getElementById('ranking-type-select').value;
  rankingActiveFases = new Set();
  const faseWrap = document.getElementById('ranking-fase-wrap');
  if (faseWrap) {
    if (rankingActiveType === 'competitie') {
      const fases = [...new Set(wedstrijdenData.filter(w=>w.wed_type==='competitie').map(w=>w.wed_fase).filter(Boolean))];
      if (fases.length) {
        faseWrap.style.display = 'flex';
        faseWrap.innerHTML = fases.map(f=>`<button onclick="toggleRankingFase('${f}',this)" style="padding:4px 12px;border-radius:100px;border:1px solid var(--border);font-size:11px;font-weight:600;cursor:pointer;background:var(--white);color:var(--text2);font-family:var(--font-ui)">${f}</button>`).join('');
      } else { faseWrap.style.display = 'none'; }
    } else { faseWrap.style.display = 'none'; faseWrap.innerHTML = ''; }
  }
  renderRankingPanel();
}

function toggleRankingFase(fase, btn) {
  if (rankingActiveFases.has(fase)) {
    rankingActiveFases.delete(fase);
    btn.style.background = 'var(--white)'; btn.style.color = 'var(--text2)'; btn.style.borderColor = 'var(--border)';
  } else {
    rankingActiveFases.add(fase);
    btn.style.background = 'var(--topbar)'; btn.style.color = '#fff'; btn.style.borderColor = 'var(--topbar)';
  }
  renderRankingPanel();
}

function gefilterdWedstrijden() {
  let lijst = wedstrijdenData;
  if (rankingActiveType !== 'alle') {
    lijst = lijst.filter(w => (w.wed_type || 'oefenwedstrijd') === rankingActiveType);
  }
  if (rankingActiveFases.size > 0) {
    lijst = lijst.filter(w => rankingActiveFases.has(w.wed_fase || ''));
  }
  return lijst;
}

function sortRanking(mode) {
  rankingSortMode = mode;
  const alfa = document.getElementById('sort-alfa');
  const cijf = document.getElementById('sort-cijfer');
  if (alfa) { alfa.style.background = mode==='alfa'?'var(--topbar)':'var(--white)'; alfa.style.color = mode==='alfa'?'#fff':'var(--text2)'; alfa.style.border = mode==='alfa'?'none':'1px solid var(--border)'; }
  if (cijf) { cijf.style.background = mode==='cijfer'?'var(--topbar)':'var(--white)'; cijf.style.color = mode==='cijfer'?'#fff':'var(--text2)'; cijf.style.border = mode==='cijfer'?'none':'1px solid var(--border)'; }
  renderRankingPanel();
}

function renderRankingPanel() {
  const wed = gefilterdWedstrijden();
  const gespeeld = wed.filter(w=>w.gespeeld);
  const gewon = gespeeld.filter(w=>w.score_eigen>w.score_tegen).length;
  const gelijk = gespeeld.filter(w=>w.score_eigen===w.score_tegen).length;
  const verl = gespeeld.filter(w=>w.score_eigen<w.score_tegen).length;
  const saldo = gespeeld.reduce((s,w)=>s+(w.score_eigen||0)-(w.score_tegen||0),0);
  const set = (id,v) => { const el=document.getElementById(id); if(el) el.textContent=v; };
  set('rk-gespeeld', gespeeld.length);
  set('rk-gewon', gewon);
  set('rk-gelijk', gelijk);
  set('rk-verl', verl);
  set('rk-saldo', (saldo>0?'+':'')+saldo);
  document.getElementById('rk-saldo').style.color = saldo>0?'var(--groen)':saldo<0?'var(--red)':'var(--text)';

  const motmEl = document.getElementById('ranking-motm');
  const cijferEl = document.getElementById('ranking-cijfers');
  if (!motmEl || !cijferEl) return;

  const motmMap = {};
  players.forEach(p=>motmMap[p.id]=0);
  wed.forEach(w=>{ if(w.motm&&motmMap[w.motm]!==undefined) motmMap[w.motm]++; });
  const motmRanked = players.map(p=>({p,motm:motmMap[p.id]||0})).filter(x=>x.motm>0).sort((a,b)=>b.motm-a.motm);
  motmEl.innerHTML = motmRanked.length ? motmRanked.map((x,i)=>`
    <div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2)">
      <span style="font-size:13px;font-weight:700;color:var(--text3);min-width:20px">${i+1}</span>
      <span style="flex:1;font-size:14px;font-weight:600;color:var(--text)">${x.p.naam}</span>
      <span style="font-size:13px;font-weight:700;color:var(--accent)">${x.motm}× ⭐</span>
    </div>`).join('') : '<div style="font-size:13px;color:var(--text3)">Nog geen MOTM toegewezen.</div>';

  const ratingMap = {};
  players.forEach(p=>ratingMap[p.id]={sum:0,count:0});
  wed.forEach(w=>{ if(w.ratings) Object.entries(w.ratings).forEach(([pid,val])=>{ if(ratingMap[pid]){ratingMap[pid].sum+=parseFloat(val);ratingMap[pid].count++;} }); });
  let lijst = players.map(p=>({p,avg:ratingMap[p.id].count?Math.round(ratingMap[p.id].sum/ratingMap[p.id].count*10)/10:null,count:ratingMap[p.id].count})).filter(x=>x.avg!==null);
  if (rankingSortMode==='cijfer') lijst.sort((a,b)=>b.avg-a.avg); else lijst.sort((a,b)=>a.p.naam.localeCompare(b.p.naam));
  cijferEl.innerHTML = lijst.length ? lijst.map((x,i)=>{
    const col=x.avg>=8?'var(--groen)':x.avg>=6.5?'var(--groen)':x.avg>=5?'var(--goud)':'var(--red)';
    const pct=Math.round((x.avg/10)*100);
    return `<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2)">
      ${rankingSortMode==='cijfer'?`<span style="font-size:13px;font-weight:700;color:var(--text3);min-width:20px">${i+1}</span>`:''}
      <span style="flex:1;font-size:14px;font-weight:500;color:var(--text)">${x.p.naam}</span>
      <div style="width:80px;height:6px;background:var(--line2);border-radius:100px;overflow:hidden;flex-shrink:0"><div style="width:${pct}%;height:100%;background:${col};border-radius:100px"></div></div>
      <span style="font-size:15px;font-weight:700;color:${col};min-width:32px;text-align:right">${x.avg}</span>
      <span style="font-size:11px;color:var(--text3)">${x.count}×</span>
    </div>`;
  }).join('') : '<div style="font-size:13px;color:var(--text3)">Geen beoordelingen in deze selectie.</div>';
}

</script>
</head>

<div class="page-wrap">
  <div class="page-header">
    <div class="page-header-row">
      <div style="display:flex;align-items:baseline;gap:10px">
        <div class="page-title">Dashboard</div>
        <div class="page-sub" id="dashboard-sub">Seizoen 2026/2027</div>
      </div>
    </div>
  </div>

  <!-- Statistieken balk -->
  <div style="padding:14px 16px 0">
    <div id="aanw-samenvatting"></div>
  </div>

  <!-- Menu blokken -->
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;padding:10px 16px 14px">
    <button onclick="dashTab('afwezig')" id="dtab-afwezig"
      style="background:var(--white);border:2px solid var(--topbar);border-radius:var(--r);padding:14px;text-align:left;cursor:pointer;box-shadow:var(--card-shadow);transition:all .15s">
      <div style="font-size:22px;margin-bottom:6px">📋</div>
      <div style="font-size:13px;font-weight:700;color:var(--text)">Afwezigheid</div>
      <div style="font-size:11px;color:var(--text3);margin-top:2px">Per speler</div>
    </button>
    <button onclick="dashTab('skills')" id="dtab-skills"
      style="background:var(--white);border:2px solid var(--border);border-radius:var(--r);padding:14px;text-align:left;cursor:pointer;box-shadow:var(--card-shadow);transition:all .15s">
      <div style="font-size:22px;margin-bottom:6px">🎯</div>
      <div style="font-size:13px;font-weight:700;color:var(--text)">Skills</div>
      <div style="font-size:11px;color:var(--text3);margin-top:2px">Team overzicht</div>
    </button>
    <button onclick="dashTab('ranking')" id="dtab-ranking"
      style="background:var(--white);border:2px solid var(--border);border-radius:var(--r);padding:14px;text-align:left;cursor:pointer;box-shadow:var(--card-shadow);transition:all .15s">
      <div style="font-size:22px;margin-bottom:6px">🏆</div>
      <div style="font-size:13px;font-weight:700;color:var(--text)">Ranking</div>
      <div style="font-size:11px;color:var(--text3);margin-top:2px">MOTM &amp; cijfers</div>
    </button>
    <button onclick="dashTab('minuten')" id="dtab-minuten"
      style="background:var(--white);border:2px solid var(--border);border-radius:var(--r);padding:14px;text-align:left;cursor:pointer;box-shadow:var(--card-shadow);transition:all .15s">
      <div style="font-size:22px;margin-bottom:6px">⏱️</div>
      <div style="font-size:13px;font-weight:700;color:var(--text)">Speelminuten</div>
      <div style="font-size:11px;color:var(--text3);margin-top:2px">Per speler</div>
    </button>
  </div>

  <!-- Afwezigheid panel -->
  <div id="dpanel-afwezig" style="padding:0 16px 16px">
    <div id="aanw-tabel"></div>
  </div>

  <!-- Ranking panel -->
  <div id="dpanel-ranking" style="display:none;padding:0 16px 16px">
    <div style="margin-bottom:10px">
      <div style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">Filter wedstrijden</div>
      <select id="ranking-type-select" onchange="onRankingTypeChange()" style="width:100%;padding:8px 12px;background:var(--white);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:var(--font-ui);font-size:13px;font-weight:500;outline:none;-webkit-appearance:none;appearance:none;background-image:url('data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 12 8%22><path d=%22M1 1l5 5 5-5%22 stroke=%22%232B1FA0%22 stroke-width=%221.5%22 fill=%22none%22/></svg>');background-repeat:no-repeat;background-position:right 12px center;background-size:10px">
        <option value="alle">Alle wedstrijden</option>
        <option value="competitie">Competitie</option>
        <option value="beker">Beker</option>
        <option value="oefenwedstrijd">Oefenwedstrijd</option>
      </select>
      <div id="ranking-fase-wrap" style="display:none;margin-top:6px;display:flex;gap:5px;flex-wrap:wrap"></div>
    </div>
    <!-- Statistieken strip -->
    <div style="background:var(--white);border:1px solid var(--border);border-radius:var(--r);margin-bottom:10px;overflow:hidden">
      <div style="display:grid;grid-template-columns:repeat(5,1fr)">
        <div style="text-align:center;padding:10px 6px;border-right:1px solid var(--border)">
          <div id="rk-gespeeld" style="font-size:20px;font-weight:700;color:var(--text);font-family:var(--font-display)">0</div>
          <div style="font-size:9px;font-weight:700;color:var(--text3);text-transform:uppercase;margin-top:2px">Gespeeld</div>
        </div>
        <div style="text-align:center;padding:10px 6px;border-right:1px solid var(--border)">
          <div id="rk-gewon" style="font-size:20px;font-weight:700;color:var(--groen);font-family:var(--font-display)">0</div>
          <div style="font-size:9px;font-weight:700;color:var(--text3);text-transform:uppercase;margin-top:2px">Gewon.</div>
        </div>
        <div style="text-align:center;padding:10px 6px;border-right:1px solid var(--border)">
          <div id="rk-gelijk" style="font-size:20px;font-weight:700;color:var(--goud);font-family:var(--font-display)">0</div>
          <div style="font-size:9px;font-weight:700;color:var(--text3);text-transform:uppercase;margin-top:2px">Gelijk</div>
        </div>
        <div style="text-align:center;padding:10px 6px;border-right:1px solid var(--border)">
          <div id="rk-verl" style="font-size:20px;font-weight:700;color:var(--red);font-family:var(--font-display)">0</div>
          <div style="font-size:9px;font-weight:700;color:var(--text3);text-transform:uppercase;margin-top:2px">Verl.</div>
        </div>
        <div style="text-align:center;padding:10px 6px">
          <div id="rk-saldo" style="font-size:20px;font-weight:700;color:var(--text);font-family:var(--font-display)">0</div>
          <div style="font-size:9px;font-weight:700;color:var(--text3);text-transform:uppercase;margin-top:2px">Saldo</div>
        </div>
      </div>
    </div>
    <!-- Sortering -->
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
      <div style="font-size:12px;font-weight:600;color:var(--text3)">Sorteren:</div>
      <button id="sort-alfa" onclick="sortRanking('alfa')" style="padding:5px 14px;border-radius:100px;background:var(--topbar);color:#fff;border:none;font-family:var(--font-ui);font-size:12px;font-weight:600;cursor:pointer">Alfabetisch</button>
      <button id="sort-cijfer" onclick="sortRanking('cijfer')" style="padding:5px 14px;border-radius:100px;background:var(--white);color:var(--text2);border:1px solid var(--border);font-family:var(--font-ui);font-size:12px;font-weight:600;cursor:pointer">Hoogste cijfer</button>
    </div>
    <div style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">Man of the Match</div>
    <div id="ranking-motm" style="margin-bottom:20px"></div>
    <div style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">Gemiddeld cijfer</div>
    <div id="ranking-cijfers"></div>
  </div>

  <!-- Speelminuten panel -->
  <div id="dpanel-minuten" style="display:none;padding:0 16px 16px">
    <div id="minuten-lijst"></div>
  </div>

  <!-- Skills panel -->
  <div id="dpanel-skills" style="display:none;padding:0 16px 16px">
    <!-- Portrait: enkele kolom. Landscape: twee kolommen via CSS -->
    <div class="skills-layout">
      <div id="profiel-content" class="skills-list" style="font-size:13px;color:var(--text3);line-height:1.7">
        Formulieren worden automatisch ingeladen zodra spelers ze invullen.
      </div>
      <div id="skills-detail-panel" class="skills-detail" style="display:none">
        <div style="font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px" id="skills-detail-title">Detail</div>

<script src="app.js"></script>
<script>
const state = loadState();
let players      = state.players;
let aanwezigheid = state.aanwezigheid;
let customWeken  = state.customWeken;
let wedstrijden  = state.wedstrijden;
let wissels      = [];
let eindeMomenten = {};
let absRedenen   = JSON.parse(localStorage.getItem('fcp_abs_redenen') || '["Ziek","Geblesseerd","Leren","Feest","Anders","Onbekend"]');
function saveAbsRedenen(r) {
  localStorage.setItem('fcp_abs_redenen', JSON.stringify(r));
  if (supabaseReady) saveAbsRedenenRemote(r);
}

// ─── AANWEZIGHEID OVERZICHT ───
function renderAanwOverzicht() {
  // Verzamel alle trainingen uit customWeken
  const trainingen = [];
  customWeken.forEach((w, wi) => {
    w.sessies.forEach((s, si) => {
      trainingen.push({ nk: 'cw' + wi + '_' + si, label: s.dag, week: w.focus, datum: w.datum || w.weekNr || '' });
    });
  });

  if (!trainingen.length || !players.length) {
    document.getElementById('aanw-samenvatting').innerHTML = '<div style="font-size:12px;color:var(--text3)">Nog geen trainingen of spelers aangemaakt.</div>';
    document.getElementById('aanw-tabel').innerHTML = '';
    return;
  }

  const sorted = sortedPlayers(players);

  // Samenvatting: totaal aantal trainingen met opgeslagen aanwezigheid
  const metData = trainingen.filter(t => aanwezigheid[t.nk] && Object.keys(aanwezigheid[t.nk]).length > 0);
  const wedstrijden = JSON.parse(localStorage.getItem('fcp_wed') || '[]');
  const aantalWed = wedstrijden.filter(w => w.gespeeld).length;
  document.getElementById('aanw-samenvatting').innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px">
      <div style="padding:11px 13px;background:var(--blauw-l);border:1px solid var(--blauw-m);border-radius:var(--r)">
        <div style="font-size:24px;font-weight:700;color:var(--text)">${trainingen.length}</div>
        <div style="font-size:10px;font-weight:700;color:var(--blauw);text-transform:uppercase;letter-spacing:.05em;margin-top:2px">Trainingen</div>
      </div>
      <div style="padding:11px 13px;background:var(--blauw-l);border:1px solid var(--blauw-m);border-radius:var(--r)">
        <div style="font-size:24px;font-weight:700;color:var(--text)">${aantalWed}</div>
        <div style="font-size:10px;font-weight:700;color:var(--blauw);text-transform:uppercase;letter-spacing:.05em;margin-top:2px">Wedstrijden</div>
      </div>
    </div>`;

  // Tabel: spelers als rijen, trainingen als kolommen
  // Compactere weergave: per speler totaal afwezig + per reden telling + per training symbool
  let html = '';

  // Per speler samenvatting
  html += '<div style="display:flex;flex-direction:column;gap:8px">';
  sorted.forEach(p => {
    let totaalAfw = 0;
    const redenTelling = {};
    const trainingsDetails = [];

    trainingen.forEach(t => {
      const entry = aanwezigheid[t.nk]?.[p.id];
      let isAfw = false;
      let reden = '';
      if (entry === false) { isAfw = true; } // oud formaat
      else if (entry && entry.afwezig === true) { isAfw = true; reden = entry.reden || ''; }
      if (isAfw) {
        totaalAfw++;
        redenTelling[reden || 'Onbekend'] = (redenTelling[reden || 'Onbekend'] || 0) + 1;
      }
      trainingsDetails.push({ label: t.label, week: t.week, isAfw, reden });
    });

    if (totaalAfw === 0) return; // Toon alleen spelers met minstens 1 afwezigheid

    const redenBadges = Object.entries(redenTelling).map(([r, n]) =>
      `<span style="font-size:10px;padding:1px 6px;background:var(--bg3);border:1px solid var(--line2);border-radius:10px;color:var(--text3)">${r}: ${n}x</span>`
    ).join('');

    const detailRows = trainingsDetails.filter(d => d.isAfw).map(d =>
      `<div style="display:flex;gap:8px;align-items:center;padding:4px 0;border-bottom:1px solid var(--line2)">
        <span style="font-size:11px;color:var(--text3);flex:1">${d.week} · ${d.label}</span>
        <span style="font-size:11px;color:var(--text3)">${d.reden || '—'}</span>
      </div>`
    ).join('');

    html += `<div style="background:var(--bg2);border:1px solid var(--line2);border-radius:var(--rsm);overflow:hidden">
      <div onclick="toggleSpelerDetail('detail-${p.id}')" style="display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer">
        <div style="flex:1">
          <div style="font-size:13px;color:var(--text);font-weight:500">${p.naam}</div>
          <div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:4px">${redenBadges}</div>
        </div>
        <div style="text-align:right;flex-shrink:0">
          <div style="font-size:18px;font-weight:700;color:var(--text2)">${totaalAfw}×</div>
          <div style="font-size:10px;color:var(--text3)">afwezig</div>
        </div>
      </div>
      <div id="detail-${p.id}" style="display:none;padding:0 12px 10px;border-top:1px solid var(--line2)">
        ${detailRows}
      </div>
    </div>`;
  });
  html += '</div>';

  // Als geen spelers afwezig zijn geweest
  if (!sorted.some(p => {
    return trainingen.some(t => {
      const e = aanwezigheid[t.nk]?.[p.id];
      return e === false || (e && e.afwezig === true);
    });
  })) {
    html = '<div style="font-size:12px;color:var(--text3);padding:12px 0">Nog geen afwezigheid geregistreerd.</div>';
  }

  document.getElementById('aanw-tabel').innerHTML = html;
}

function dashTab(tab) {
  const tabs = ['afwezig','skills','ranking','minuten'];
  tabs.forEach(t => {
    const panel = document.getElementById('dpanel-' + t);
    const btn   = document.getElementById('dtab-' + t);
    if (!panel || !btn) return;
    const actief = t === tab;
    panel.style.display = actief ? 'block' : 'none';
    btn.style.borderColor = actief ? 'var(--topbar)' : 'var(--border)';
    btn.querySelector('div:nth-child(2)').style.color = actief ? 'var(--accent)' : 'var(--text)';
  });
}

// ─── SPEELMINUTEN ───
// Puur feitelijk overzicht, geen kleurcodering ("goed/fout") — zie berekenSpeeltijd() in app.js
// voor hoe de minuten worden opgebouwd uit wed_lineup + de wissels-tabel.
// Wedstrijden van vóór de introductie van deze functie tellen bewust niet mee: voor die
// wedstrijden zijn nooit wissels geregistreerd, dus "in de basisopstelling en geen wissel"
// zou daar ten onrechte als "hele wedstrijd gespeeld" tellen. Vaste datum (geen "vandaag" —
// anders schuift de grens elke dag mee en vallen ook al getrackte wedstrijden er later uit).
const WISSEL_TRACKING_VANAF = '2026-08-26';
function renderSpeelminuten() {
  const cont = document.getElementById('minuten-lijst'); if (!cont) return;
  const sorted = sortedPlayers(players);
  let html = '<div style="display:flex;flex-direction:column;gap:8px">';
  let anyData = false;
  sorted.forEach(p => {
    const perWedstrijd = [];
    let totaalMin = 0;
    wedstrijden.filter(w => (w.isoDate || '') >= WISSEL_TRACKING_VANAF).forEach(w => {
      const minuten = berekenSpeeltijd(w.id, p.id, w, wissels, eindeMomenten[w.id]);
      const eigenWissels = wissels.filter(ws => ws.wedstrijd_id === w.id && ws.speler_id === p.id);
      const inBasis = !!(w.wed_lineup && Object.values(w.wed_lineup).includes(p.id));
      if (minuten > 0) { perWedstrijd.push({ w, minuten, eigenWissels, inBasis }); totaalMin += minuten; }
    });
    if (!perWedstrijd.length) return;
    anyData = true;

    const detailRows = perWedstrijd.map(x => {
      const momentenTxt = x.eigenWissels.slice()
        .sort((a,b)=>(a.wedstrijd_minuut||0)-(b.wedstrijd_minuut||0))
        .map(m => (m.moment === 'erin' ? 'Erin ' : 'Eruit ') + (m.wedstrijd_minuut||0) + "'" + (m.reden ? ' — ' + m.reden : ''))
        .join(' · ');
      const subTxt = momentenTxt || (x.inBasis ? 'Basisopstelling, geen wissels' : '');
      return `<div style="padding:6px 0;border-bottom:1px solid var(--line2)">
        <div style="display:flex;justify-content:space-between;gap:8px">
          <span style="font-size:11px;color:var(--text2)">${x.w.datum || x.w.isoDate || ''} · vs ${x.w.tegenstander || '—'}</span>
          <span style="font-size:11px;font-weight:700;color:var(--text2)">${x.minuten} min</span>
        </div>
        ${subTxt ? `<div style="font-size:10px;color:var(--text3);margin-top:1px">${subTxt}</div>` : ''}
      </div>`;
    }).join('');

    html += `<div style="background:var(--bg2);border:1px solid var(--line2);border-radius:var(--rsm);overflow:hidden">
      <div onclick="toggleSpelerDetail('minuten-detail-${p.id}')" style="display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer">
        <div style="flex:1">
          <div style="font-size:13px;color:var(--text);font-weight:500">${p.naam}</div>
          <div style="font-size:11px;color:var(--text3);margin-top:2px">${perWedstrijd.length} wedstrijd${perWedstrijd.length===1?'':'en'}</div>
        </div>
        <div style="text-align:right;flex-shrink:0">
          <div style="font-size:18px;font-weight:700;color:var(--text2)">${totaalMin}</div>
          <div style="font-size:10px;color:var(--text3)">minuten</div>
        </div>
      </div>
      <div id="minuten-detail-${p.id}" style="display:none;padding:0 12px 10px;border-top:1px solid var(--line2)">
        ${detailRows}
      </div>
    </div>`;
  });
  html += '</div>';
  if (!anyData) html = '<div style="font-size:12px;color:var(--text3);padding:12px 0">Nog geen speelminuten geregistreerd — wissels worden vastgelegd via 🔄 Wissel tijdens een live wedstrijd.</div>';
  cont.innerHTML = html;
}
async function laadSpeelminuten() {
  wissels = await haalAlleWissels();
  eindeMomenten = await haalAlleEindeMomenten();
  renderSpeelminuten();
}

function toggleSpelerDetail(id) {
  const el = document.getElementById(id);
  if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

// ─── REDENEN BEHEREN ───
function openRedenModal() {
  renderRedenList();
  document.getElementById('bmodalRedenen').classList.add('open');
}
function closeRedenModal() {
  document.getElementById('bmodalRedenen').classList.remove('open');
  renderAanwOverzicht();
}

function renderRedenList() {
  const cont = document.getElementById('reden-list'); cont.innerHTML = '';
  absRedenen.forEach((r, i) => {
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--bg3);border:1px solid var(--line2);border-radius:var(--rsm)';
    row.innerHTML = `<span style="flex:1;font-size:12px;color:var(--text)">${r}</span>
      <button onclick="deleteReden(${i})" style="padding:3px 8px;background:transparent;border:1px solid var(--red);border-radius:4px;color:var(--red);font-size:11px;cursor:pointer">✕</button>`;
    cont.appendChild(row);
  });
}

function addReden() {
  const val = document.getElementById('new-reden-input').value.trim();
  if (!val || absRedenen.includes(val)) { showToast(val ? 'Bestaat al' : 'Vul een reden in'); return; }
  absRedenen.push(val);
  saveAbsRedenen(absRedenen);
  document.getElementById('new-reden-input').value = '';
  renderRedenList();
  showToast(val + ' toegevoegd');
}

function deleteReden(i) {
  if (!confirm('Verwijder reden "' + absRedenen[i] + '"?')) return;
  const naam = absRedenen[i];
  absRedenen.splice(i, 1);
  saveAbsRedenen(absRedenen);
  renderRedenList();
  showToast(naam + ' verwijderd');
}

// ─── SKILLS: speler- en trainersbeoordelingen (nieuw) ───
let alleSpelerBeoordelingen = [];
let alleTrainerBeoordelingen = [];

async function laadAlleFormulieren() {
  if (!supabaseReady) return;
  [alleSpelerBeoordelingen, alleTrainerBeoordelingen] = await Promise.all([
    haalAlleSpelerBeoordelingen(),
    haalAlleTrainerBeoordelingen(),
  ]);
}

function skillNiveauLabel(cat) { return cat.charAt(0).toUpperCase() + cat.slice(1); }

// Per speler: laatste + voorlaatste rij (asc gesorteerd, dus einde van de array = nieuwste)
function laatsteRijen(rijen, spelerId) {
  const van = rijen.filter(r => r.speler_id === spelerId).sort((a,b) => new Date(a.created_at) - new Date(b.created_at));
  return { huidig: van[van.length-1] || null, vorige: van[van.length-2] || null };
}

function berekenTeamVerschillen() {
  const perSkill = {};
  players.forEach(p => {
    const { huidig: sRij } = laatsteRijen(alleSpelerBeoordelingen, p.id);
    const { huidig: tRij } = laatsteRijen(alleTrainerBeoordelingen, p.id);
    const sSkills = sRij ? (sRij.data.skills || {}) : {};
    const tSkills = tRij ? (tRij.skills || {}) : {};
    Object.entries(sSkills).forEach(([skill, sW]) => {
      const tW = tSkills[skill];
      if (!tW || SKILL_NIVEAU_PCT[sW] === undefined || SKILL_NIVEAU_PCT[tW] === undefined) return;
      const verschilNiveaus = (SKILL_NIVEAU_PCT[sW] - SKILL_NIVEAU_PCT[tW]) / 32;
      (perSkill[skill] = perSkill[skill] || []).push(verschilNiveaus);
    });
  });
  return Object.entries(perSkill)
    .map(([skill, lijst]) => ({ skill, gem: lijst.reduce((a,b)=>a+b,0) / lijst.length, n: lijst.length }))
    .sort((a,b) => Math.abs(b.gem) - Math.abs(a.gem));
}

function berekenTeamOntwikkeling() {
  const perSkill = {};
  players.forEach(p => {
    const { huidig, vorige } = laatsteRijen(alleSpelerBeoordelingen, p.id);
    if (!huidig || !vorige) return;
    const nu = huidig.data.skills || {}, was = vorige.data.skills || {};
    Object.entries(nu).forEach(([skill, w]) => {
      const vW = was[skill];
      if (!vW || SKILL_NIVEAU_PCT[w] === SKILL_NIVEAU_PCT[vW] || SKILL_NIVEAU_PCT[w] === undefined || SKILL_NIVEAU_PCT[vW] === undefined) return;
      const richting = SKILL_NIVEAU_PCT[w] > SKILL_NIVEAU_PCT[vW] ? 'vooruit' : 'terug';
      perSkill[skill] = perSkill[skill] || { vooruit:0, terug:0 };
      perSkill[skill][richting]++;
    });
  });
  return Object.entries(perSkill)
    .map(([skill, t]) => ({ skill, ...t, netto: t.vooruit - t.terug }))
    .sort((a,b) => Math.abs(b.netto) - Math.abs(a.netto));
}

function renderTeamProfiel() {
  const cont = document.getElementById('profiel-content');
  const heeftSpelerData = players.some(p => laatsteRijen(alleSpelerBeoordelingen, p.id).huidig);
  const heeftTrainerData = players.some(p => laatsteRijen(alleTrainerBeoordelingen, p.id).huidig);
  if (!heeftSpelerData && !heeftTrainerData) {
    cont.innerHTML = '<div style="font-size:12px;color:var(--text3)">Nog geen beoordelingen ingevuld.</div>';
    return;
  }

  const NK = {
    'Ontwikkel punt': { bg:'#FFEBEE', fill:'#C62828', text:'#C62828', label:'Ontwikkelpunt' },
    'Voldoende':      { bg:'#FFF3E0', fill:'#E65100', text:'#E65100', label:'Voldoende' },
    'Goed':           { bg:'#F1F8E9', fill:'#558B2F', text:'#558B2F', label:'Goed' },
    'Zeer goed':      { bg:'#E8F5E9', fill:'#1B5E20', text:'#1B5E20', label:'Zeer goed' },
  };

  let html = `<div style="font-size:11px;color:var(--text3);margin-bottom:16px">
    <span class="cmp-legend-dot" style="background:var(--blauw)"></span>Speler gem. &nbsp;
    <span class="cmp-legend-dot" style="background:var(--goud)"></span>Trainer gem.
  </div>`;

  // ─── Grootste verschillen speler ↔ trainer ───
  const verschillen = berekenTeamVerschillen().filter(v => Math.abs(v.gem) >= 0.4).slice(0, 5);
  if (verschillen.length) {
    html += `<div style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px">📊 Grootste verschillen speler ↔ trainer</div>`;
    verschillen.forEach(v => {
      const richting = v.gem > 0 ? 'Spelers schatten zichzelf gemiddeld hoger in' : 'Trainer ziet meer potentie dan spelers zelf';
      const pctSpeler = 50 + v.gem * -20, pctTrainer = 50 + v.gem * 20; // puur voor de indicatorpositie, niet exact schaal
      html += `<div style="margin-bottom:14px">
        <div style="display:flex;justify-content:space-between;align-items:baseline;gap:6px">
          <div style="font-size:13px;font-weight:700;color:var(--text)">${v.skill}</div>
          <div style="font-size:12px;font-weight:700;color:var(--goud)">Ø ${Math.abs(v.gem).toFixed(1)}</div>
        </div>
        <div style="font-size:11px;color:var(--text3);margin-bottom:5px">${richting}</div>
        <div style="position:relative;height:14px">
          <div style="position:absolute;top:50%;left:0;right:0;height:2px;background:var(--border);transform:translateY(-50%)"></div>
          <div style="position:absolute;top:50%;width:10px;height:10px;border-radius:50%;background:var(--blauw);transform:translate(-50%,-50%);left:${Math.max(4,Math.min(96,pctSpeler))}%"></div>
          <div style="position:absolute;top:50%;width:10px;height:10px;border-radius:50%;background:var(--goud);transform:translate(-50%,-50%);left:${Math.max(4,Math.min(96,pctTrainer))}%"></div>
        </div>
      </div>`;
    });
  }

  // ─── Grootste ontwikkeling deze periode (obv eigen inschatting van spelers) ───
  const ontwikkeling = berekenTeamOntwikkeling().filter(o => o.netto !== 0).slice(0, 4);
  if (ontwikkeling.length) {
    html += `<div style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin:20px 0 10px">📈 Grootste ontwikkeling deze periode <span style="font-weight:400;text-transform:none">(obv eigen inschatting)</span></div>`;
    html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px">';
    ontwikkeling.forEach(o => {
      const vooruit = o.netto > 0;
      html += `<div style="background:var(--white);border:1px solid var(--border);border-radius:var(--rsm);padding:10px;text-align:center">
        <div style="font-size:11px;color:var(--text2);margin-bottom:4px">${o.skill}</div>
        <div style="font-size:18px;font-weight:700;color:${vooruit?'var(--groen)':'var(--rood)'}">${vooruit?'↑':'↓'}</div>
        <div style="font-size:9px;color:var(--text3);margin-top:2px">${vooruit?o.vooruit:o.terug} speler${(vooruit?o.vooruit:o.terug)===1?'':'s'} ${vooruit?'vooruit':'terug'}</div>
      </div>`;
    });
    html += '</div>';
  }

  // ─── Verdeling per vaardigheid — speler vs trainer ───
  html += `<div style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin:16px 0 10px;padding-top:12px;border-top:1px solid var(--border)">Verdeling per vaardigheid</div>`;

  Object.entries(FORM_SKILLS).forEach(([catKey, skills]) => {
    html += `<div style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin:14px 0 8px">${skillNiveauLabel(catKey)}</div>`;
    skills.forEach(skill => {
      const sTellingen = SKILL_OPTIES.map(lv => {
        const namen = players.filter(p => (laatsteRijen(alleSpelerBeoordelingen, p.id).huidig?.data.skills || {})[skill] === lv).map(p => p.naam);
        return { lv, namen };
      }).filter(c => c.namen.length > 0);
      const tTellingen = SKILL_OPTIES.map(lv => {
        const namen = players.filter(p => (laatsteRijen(alleTrainerBeoordelingen, p.id).huidig?.skills || {})[skill] === lv).map(p => p.naam);
        return { lv, namen };
      }).filter(c => c.namen.length > 0);
      if (!sTellingen.length && !tTellingen.length) return;

      const sTotal = sTellingen.reduce((a,c)=>a+c.namen.length,0);
      const tTotal = tTellingen.reduce((a,c)=>a+c.namen.length,0);
      const sid = 'sk-' + skill.replace(/\s+/g,'_');

      const bouwBalk = (tellingen, totaal, bron) => {
        if (!totaal) return `<div style="font-size:10px;color:var(--text3)">Nog geen ${bron}-data</div>`;
        const dominant = tellingen.reduce((a,b) => a.namen.length >= b.namen.length ? a : b);
        const nk = NK[dominant.lv] || NK['Voldoende'];
        const pct = Math.round((dominant.namen.length / totaal) * 100);
        return `<div style="display:flex;align-items:center;gap:6px">
          <span style="font-size:9px;color:var(--text3);width:42px;flex-shrink:0">${bron}</span>
          <div style="flex:1;height:7px;background:var(--border);border-radius:100px;overflow:hidden">
            <div style="height:100%;width:${pct}%;background:${nk.fill};border-radius:100px"></div>
          </div>
          <span style="font-size:9px;font-weight:700;color:${nk.text};flex-shrink:0;min-width:56px">${nk.label}</span>
        </div>`;
      };

      html += `<div style="margin-bottom:12px;cursor:pointer" onclick="toggleDetail('${sid}')">
        <div style="font-size:12px;font-weight:600;color:var(--text);margin-bottom:4px">${skill}</div>
        ${bouwBalk(sTellingen, sTotal, 'Speler')}
        <div style="height:3px"></div>
        ${bouwBalk(tTellingen, tTotal, 'Trainer')}
        <div id="${sid}" style="display:none;margin-top:6px;padding:8px 10px;background:var(--bg);border:1px solid var(--border);border-radius:var(--rsm)">
          <div style="font-size:9px;font-weight:700;color:var(--blauw);text-transform:uppercase;margin-bottom:3px">Speler</div>
          ${sTellingen.map(c => `<div style="font-size:11px;color:var(--text2);margin-bottom:2px"><b style="color:${(NK[c.lv]||{}).text}">${c.lv}:</b> ${c.namen.join(', ')}</div>`).join('') || '<div style="font-size:11px;color:var(--text3)">Geen data</div>'}
          <div style="font-size:9px;font-weight:700;color:var(--goud);text-transform:uppercase;margin:6px 0 3px">Trainer</div>
          ${tTellingen.map(c => `<div style="font-size:11px;color:var(--text2);margin-bottom:2px"><b style="color:${(NK[c.lv]||{}).text}">${c.lv}:</b> ${c.namen.join(', ')}</div>`).join('') || '<div style="font-size:11px;color:var(--text3)">Geen data</div>'}
        </div>
      </div>`;
    });
  });

  cont.innerHTML = html;
}

function toggleDetail(id) {
  const isLandscape = window.innerWidth > window.innerHeight;
  if (isLandscape) {
    // In landscape: toon detail in rechter paneel
    const panel = document.getElementById('skills-detail-panel');
    const content = document.getElementById('skills-detail-content');
    const title = document.getElementById('skills-detail-title');
    const el = document.getElementById(id);
    if (!el || !panel || !content) return;
    // Haal skill naam uit het id (sk-Balcontrole → Balcontrole)
    const skillNaam = id.replace('sk-', '').replace(/_/g, ' ');
    if (title) title.textContent = skillNaam;
    // Kopieer inhoud van het inline detail element naar het panel
    content.innerHTML = el.innerHTML;
    panel.style.display = 'block';
  } else {
    // In portrait: inline uitklappen zoals voorheen
    const el = document.getElementById(id);
    if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
  }
}

async function onSupabaseReady() {
  const data = await loadFromSupabase();
  if (data.players)      { players      = data.players; }
  if (data.aanwezigheid) { aanwezigheid = data.aanwezigheid; }
  if (data.customWeken)  { customWeken  = data.customWeken; }
  if (data.absRedenen)   { absRedenen   = data.absRedenen; }
  if (data.wedstrijden)  { wedstrijden  = data.wedstrijden; }
  if (data.teamConfig)   { const sub = document.getElementById('dashboard-sub'); if (sub) sub.textContent = data.teamConfig.subtitel || ''; }
  await laadAlleFormulieren();
  renderAanwOverzicht();
  renderTeamProfiel();
  await laadSpeelminuten();
}

const cfg = loadTeamInstellingen(); const sub = document.getElementById('dashboard-sub'); if (sub) sub.textContent = cfg.subtitel || '';
renderAanwOverzicht();
renderTeamProfiel();
renderSpeelminuten();
initScrollTop(); initManifest();
initSupabase().then(ok => { if (ok) onSupabaseReady(); });
</script>
