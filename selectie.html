<script src="app.js"></script>
<script>
let players = loadState().players;

function toggleNieuweSpeler() {
  const f = document.getElementById('nieuwe-speler-form');
  if (f) f.style.display = f.style.display === 'none' ? 'block' : 'none';
}

async function addPlayer() {
  if (!naam) { showToast('Vul een naam in'); return; }
  const p = { id:genId(), naam, omschrijving:'', posities:[], opmerkingen:'', ontwikkeling:'', skills:null };
  if (supabaseReady) {
    const res = await createPlayer(p);
    if (!res || res._error) { showToast('Opslaan mislukt'); return; }
  }
  players.push(p);
  savePlayers(players);
  renderPlayerList();
  document.getElementById('input-naam').value = '';
  showToast(naam + ' toegevoegd');
}

async function deletePlayer(id) {
  const p = players.find(pl => pl.id === id);
  if (!confirm('Verwijder ' + (p ? p.naam : 'speler') + '?')) return;
  players = players.filter(pl => pl.id !== id);
  const lineup = loadState().lineup;
  Object.keys(lineup).forEach(k => { if (lineup[k] === id) delete lineup[k]; });
  savePlayers(players);
  saveLineup(lineup);
  if (supabaseReady) {
    const res = await deletePlayerRemote(id);
    if (res && res._error) { renderPlayerList(); return; }
  }
  renderPlayerList();
  showToast('Speler verwijderd');
}

async function savePlayerData(id) {
  const p = players.find(pl => pl.id === id); if (!p) return;
  p.omschrijving  = document.getElementById('omschr-' + id).value;
  p.opmerkingen   = document.getElementById('opm-' + id).value;
  p.ontwikkeling  = document.getElementById('ontw-' + id).value;
  savePlayers(players);
  if (supabaseReady) {
    const res = await updatePlayer(id, { omschrijving:p.omschrijving, opmerkingen:p.opmerkingen, ontwikkeling:p.ontwikkeling });
    if (res && res._error) return;
  }
  showToast(p.naam + ' opgeslagen');
}

function togglePosTag(pid, pos, el) {
  const p = players.find(pl => pl.id === pid); if (!p) return;
  if (!p.posities) p.posities = [];
  if (el.classList.contains('active')) { p.posities = p.posities.filter(x => x !== pos); el.classList.remove('active'); }
  else { p.posities.push(pos); el.classList.add('active'); }
  savePlayers(players);
  if (supabaseReady) updatePlayer(pid, { posities: p.posities });
}

function deelSpelerFormulier(pid, naam) { deelFormulier(pid, naam); }

async function wisFormulier(pid) {
  if (!confirm('Alle spelerbeoordelingen (de volledige geschiedenis) van deze speler wissen? Dit kan niet ongedaan gemaakt worden.')) return;
  if (supabaseReady) {
    await sbFetch('speler_beoordelingen?speler_id=eq.' + pid, 'DELETE');
  }
  delete beoordelingCache[pid];
  const el = document.getElementById('formulier-' + pid);
  if (el) el.innerHTML = '<div style="font-size:11px;color:var(--text3);padding:4px 0">Nog niet ingevuld</div>';
  showToast('Formulier gewist');
}

// Formulier delen
function deelFormulier(pid, naam) {
  const base = location.origin + location.pathname.replace('selectie.html','') + 'spelerformulier.html?token=';
  const token = safeEncode(pid + ':' + naam);
  // Voeg sb_url en sb_key toe zodat speler kan opslaan
  const sbUrl = localStorage.getItem('sb_url') || '';
  const sbKey = localStorage.getItem('sb_key') || '';
  let url = base + encodeURIComponent(token);
  if (sbUrl) url += '&su=' + encodeURIComponent(safeEncode(sbUrl));
  if (sbKey) url += '&sk=' + encodeURIComponent(safeEncode(sbKey));
  if (navigator.share) {
    navigator.share({ title:'Spelersformulier ' + naam, text:'Vul je formulier in voor FCP 16-2', url });
  } else {
    navigator.clipboard?.writeText(url).then(() => showToast('Link gekopieerd voor ' + naam));
  }
}

// Formulierresultaat tonen per speler
const formulierCache = {};
let beoordelingCache = {}; // pid -> {spelerHist, trainerHist}

async function laadBeoordelingen(pid) {
  if (beoordelingCache[pid]) return beoordelingCache[pid];
  if (!supabaseReady) return { spelerHist: [], trainerHist: [] };
  const [spelerHist, trainerHist] = await Promise.all([
    haalSpelerBeoordelingenGeschiedenis(pid),
    haalTrainerBeoordelingenGeschiedenis(pid),
  ]);
  beoordelingCache[pid] = { spelerHist, trainerHist };
  return beoordelingCache[pid];
}

function bouwTrackRij(bron, kleurClass, niveauNu, niveauVorige) {
  if (!niveauNu) return '';
  const pctNu = SKILL_NIVEAU_PCT[niveauNu];
  const kleurVar = kleurClass === 'c-speler' ? 'blauw' : 'goud';
  let dots = '';
  if (niveauVorige && niveauVorige !== niveauNu && SKILL_NIVEAU_PCT[niveauVorige] !== undefined) {
    dots += `<div class="cmp-track-dot ghost ${kleurClass}" style="left:${SKILL_NIVEAU_PCT[niveauVorige]}%"></div>`;
  }
  dots += `<div class="cmp-track-dot" style="left:${pctNu}%;background:var(--${kleurVar})"></div>`;
  return `<div class="cmp-row">
    <span class="cmp-src ${kleurClass}">${bron}</span>
    <div class="cmp-track"><div class="cmp-track-line"></div>
      <div class="cmp-track-tick" style="left:2%"></div><div class="cmp-track-tick" style="left:34%"></div><div class="cmp-track-tick" style="left:66%"></div><div class="cmp-track-tick" style="left:98%"></div>
      ${dots}
    </div>
    <span class="cmp-lvl ${kleurClass}">${niveauNu}</span>
  </div>`;
}

async function renderFormulierData(pid) {
  const el = document.getElementById('formulier-' + pid);
  if (!el) return;
  el.innerHTML = '<div style="font-size:11px;color:var(--text3);padding:8px 0">Laden…</div>';

  const { spelerHist, trainerHist } = await laadBeoordelingen(pid);
  const spelerRij = spelerHist[spelerHist.length - 1] || null;
  const spelerVorigeRij = spelerHist[spelerHist.length - 2] || null;
  const trainerRij = trainerHist[trainerHist.length - 1] || null;
  const trainerVorigeRij = trainerHist[trainerHist.length - 2] || null;

  if (!spelerRij && !trainerRij) {
    el.innerHTML = `<div style="font-size:11px;color:var(--text3);padding:4px 0 10px">Nog niet ingevuld</div>
      <button class="save-btn" style="width:100%" onclick="openTrainerBeoordeling('${pid}')">+ Trainersbeoordeling</button>`;
    return;
  }

  const data = spelerRij ? spelerRij.data : {};
  const spelerSkills = data.skills || {};
  const trainerSkills = trainerRij ? trainerRij.skills : {};
  const spelerVorigeSkills = spelerVorigeRij ? (spelerVorigeRij.data.skills || {}) : {};
  const trainerVorigeSkills = trainerVorigeRij ? trainerVorigeRij.skills : {};

  let html = `<div style="font-size:10px;color:var(--text3);margin-bottom:10px">
    ${spelerRij ? 'Speler: ' + new Date(spelerRij.created_at).toLocaleDateString('nl-NL') : 'Speler: nog niet ingevuld'}${trainerRij ? ' · Trainer: ' + new Date(trainerRij.created_at).toLocaleDateString('nl-NL') : ''}
  </div>`;

  const infos = [
    data.geboortedatum && ['Geboortedatum', data.geboortedatum],
    data.positie       && ['Positie',        data.positie],
    data.mobiel        && ['Mobiel',          data.mobiel],
    data.vakantie === 'ja' && ['Vakantie',    (data.vakantie_van||'?') + ' t/m ' + (data.vakantie_tot||'?')],
    data.aanvoerder    && ['Aanvoerder',      data.aanvoerder === 'ja' ? 'Ja — ' + (data.aanvoerder_waarom||'') : 'Nee, kiest ' + (data.aanvoerder_wie||'')],
  ].filter(Boolean);
  if (infos.length) {
    html += '<div style="display:flex;flex-direction:column;gap:4px;margin-bottom:10px">';
    infos.forEach(([k,v]) => html += `<div style="font-size:11px"><span style="color:var(--text3)">${k}: </span><span style="color:var(--text2)">${v}</span></div>`);
    html += '</div>';
  }

  html += `<div class="cmp-legend">
    <span><span class="cmp-legend-dot" style="background:var(--blauw)"></span>Speler</span>
    <span><span class="cmp-legend-dot" style="background:var(--goud)"></span>Trainer</span>
    <span>○ = vorige · ⚠️ = wijkt 1+ niveau af</span>
  </div>`;

  Object.entries(FORM_SKILLS).forEach(([cat, skills]) => {
    const relevant = skills.filter(s => spelerSkills[s] || trainerSkills[s]);
    if (!relevant.length) return;
    html += `<div style="font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin:12px 0 4px">${cat}</div>`;
    relevant.forEach(s => {
      const sW = spelerSkills[s], tW = trainerSkills[s];
      const wijktAf = sW && tW && SKILL_NIVEAU_PCT[sW] !== SKILL_NIVEAU_PCT[tW];
      html += `<div class="cmp-block">
        <div class="cmp-skill-naam">${s}${wijktAf ? '<span class="cmp-diff-chip">⚠️ wijkt af</span>' : ''}</div>
        ${bouwTrackRij('Speler', 'c-speler', sW, spelerVorigeSkills[s])}
        ${bouwTrackRij('Trainer', 'c-trainer', tW, trainerVorigeSkills[s])}
      </div>`;
    });
  });

  if (data.wens) html += `<div style="margin-top:10px;font-size:11px"><div style="color:var(--text3);margin-bottom:3px">Wens dit seizoen</div><div style="color:var(--text2);line-height:1.5">${data.wens}</div></div>`;
  if (data.bijzonderheden) html += `<div style="margin-top:6px;font-size:11px"><div style="color:var(--text3);margin-bottom:3px">Bijzonderheden</div><div style="color:var(--text2)">${data.bijzonderheden}</div></div>`;

  html += `<div style="display:flex;gap:8px;margin-top:14px">
    <button class="save-btn" style="flex:1" onclick="openTrainerBeoordeling('${pid}')">+ Trainersbeoordeling</button>
    <button class="del-btn" onclick="openGeschiedenis('${pid}')">📈 Geschiedenis</button>
  </div>`;

  el.innerHTML = html;
}

// ─── Trainersbeoordeling invullen ───
let tbHuidigePid = null, tbSelectie = {};

async function openTrainerBeoordeling(pid) {
  tbHuidigePid = pid;
  tbSelectie = {};
  const p = players.find(x => x.id === pid);
  document.getElementById('tb-speler-naam').textContent = (p ? p.naam : '') + ' — nieuw beoordelmoment · ' + new Date().toLocaleDateString('nl-NL');
  document.getElementById('tb-delen').checked = false;

  const { spelerHist, trainerHist } = await laadBeoordelingen(pid);
  const spelerSkills = spelerHist.length ? (spelerHist[spelerHist.length-1].data.skills || {}) : {};
  const trainerVorigeSkills = trainerHist.length ? trainerHist[trainerHist.length-1].skills : {};

  let html = '';
  Object.entries(FORM_SKILLS).forEach(([cat, skills]) => {
    html += `<div class="tb-cat-lbl">${cat}</div>`;
    skills.forEach(s => {
      const context = [];
      if (spelerSkills[s]) context.push('Speler koos: ' + spelerSkills[s]);
      if (trainerVorigeSkills[s]) context.push('vorige: ' + trainerVorigeSkills[s]);
      const opties = SKILL_OPTIES.map(o =>
        `<button type="button" class="tb-opt" data-skill="${s.replace(/"/g,'&quot;')}" data-waarde="${o}" onclick="kiesTrainerSkill(this)">${o==='Ontwikkel punt'?'Ontw.':o==='Voldoende'?'Vold.':o==='Zeer goed'?'Z.g.':'Goed'}</button>`
      ).join('');
      html += `<div class="tb-skrij">
        <div class="tb-sknaam">${s}${context.length ? ' <span style="color:var(--text3);font-weight:400">— ' + context.join(' · ') + '</span>' : ''}</div>
        <div class="tb-opties">${opties}</div>
      </div>`;
    });
  });
  document.getElementById('tb-skills-container').innerHTML = html;
  document.getElementById('bmodalTrainerBeoordeling').classList.add('open');
}

function kiesTrainerSkill(btn) {
  const skill = btn.dataset.skill, waarde = btn.dataset.waarde;
  tbSelectie[skill] = waarde;
  btn.parentElement.querySelectorAll('.tb-opt').forEach(b => b.classList.toggle('actief', b === btn));
}

function closeTrainerBeoordeling() {
  document.getElementById('bmodalTrainerBeoordeling').classList.remove('open');
}

async function opslaanTrainerBeoordeling() {
  if (!Object.keys(tbSelectie).length) { showToast('Kies minstens één vaardigheid'); return; }
  if (!supabaseReady) { showToast('Geen verbinding met Supabase'); return; }
  const gedeeld = document.getElementById('tb-delen').checked;
  const res = await nieuweTrainerBeoordeling(tbHuidigePid, tbSelectie, gedeeld);
  if (res && res._error) { showToast('⚠️ Opslaan mislukt'); return; }
  delete beoordelingCache[tbHuidigePid]; // cache legen zodat de kaart de nieuwe data ophaalt
  closeTrainerBeoordeling();
  showToast('Trainersbeoordeling opgeslagen');
  const kaart = document.getElementById('pcard-' + tbHuidigePid);
  if (kaart && kaart.classList.contains('open')) renderFormulierData(tbHuidigePid);
}

// ─── Geschiedenis ───
let histHuidigePid = null;

async function openGeschiedenis(pid) {
  histHuidigePid = pid;
  const p = players.find(x => x.id === pid);
  document.getElementById('hist-speler-naam').textContent = p ? p.naam : '';

  const { spelerHist, trainerHist } = await laadBeoordelingen(pid);
  const alleSkills = new Set();
  spelerHist.forEach(r => Object.keys(r.data.skills || {}).forEach(s => alleSkills.add(s)));
  trainerHist.forEach(r => Object.keys(r.skills || {}).forEach(s => alleSkills.add(s)));

  const select = document.getElementById('hist-skill-select');
  if (!alleSkills.size) {
    select.innerHTML = '<option>Nog geen vaardigheden beoordeeld</option>';
    document.getElementById('hist-tl-container').innerHTML = '';
  } else {
    // Sorteer op vaste volgorde uit FORM_SKILLS, niet alfabetisch
    const volgorde = Object.values(FORM_SKILLS).flat();
    const gesorteerd = volgorde.filter(s => alleSkills.has(s));
    select.innerHTML = gesorteerd.map(s => `<option value="${s.replace(/"/g,'&quot;')}">${s}</option>`).join('');
    renderGeschiedenisTijdlijn();
  }
  document.getElementById('bmodalGeschiedenis').classList.add('open');
}

function closeGeschiedenis() {
  document.getElementById('bmodalGeschiedenis').classList.remove('open');
}

async function renderGeschiedenisTijdlijn() {
  const skill = document.getElementById('hist-skill-select').value;
  const { spelerHist, trainerHist } = await laadBeoordelingen(histHuidigePid);

  const momenten = [];
  spelerHist.forEach(r => { const w = (r.data.skills||{})[skill]; if (w) momenten.push({ datum: r.created_at, bron: 'speler', waarde: w }); });
  trainerHist.forEach(r => { const w = (r.skills||{})[skill]; if (w) momenten.push({ datum: r.created_at, bron: 'trainer', id: r.id, waarde: w }); });
  momenten.sort((a,b) => new Date(b.datum) - new Date(a.datum)); // nieuwste eerst

  const cont = document.getElementById('hist-tl-container');
  if (!momenten.length) { cont.innerHTML = '<div style="font-size:12px;color:var(--text3)">Geen geschiedenis voor deze vaardigheid.</div>'; return; }

  cont.innerHTML = `<div class="hist-tl">${momenten.map((m, i) => {
    // Vorige moment van DEZELFDE bron (chronologisch eerder) om de verandering te tonen
    const vorigeZelfdeBron = momenten.slice(i+1).find(x => x.bron === m.bron);
    let deltaHtml = '';
    if (vorigeZelfdeBron) {
      const verschil = SKILL_NIVEAU_PCT[m.waarde] - SKILL_NIVEAU_PCT[vorigeZelfdeBron.waarde];
      if (verschil !== 0) {
        const richting = verschil > 0 ? 'up' : 'down';
        const pijl = verschil > 0 ? '↑' : '↓';
        const niveaus = Math.round(Math.abs(verschil) / 32);
        deltaHtml = `<div class="hist-delta ${richting}">${pijl} ${niveaus} niveau${niveaus>1?'s':''} t.o.v. vorige ${m.bron === 'speler' ? 'eigen inschatting' : 'trainersbeoordeling'}</div>`;
      }
    }
    const c = SKILL_COLORS[m.waarde] || {bg:'var(--bg3)',fg:'var(--text3)'};
    const kleurVar = m.bron === 'speler' ? 'var(--blauw)' : 'var(--goud)';
    const intrekBtn = (m.bron === 'trainer' && m.id) ? `<button class="hist-intrek" onclick="intrekGeschiedenisItem('${m.id}')">Intrekken</button>` : '';
    return `<div class="hist-item">
      <div class="hist-dot" style="color:${kleurVar};background:${kleurVar}"></div>
      <div class="hist-datum">${new Date(m.datum).toLocaleDateString('nl-NL', {day:'numeric',month:'long',year:'numeric'})}</div>
      <div class="hist-row">
        <span class="hist-wie" style="color:${kleurVar}">${m.bron === 'speler' ? '⚽ Speler' : '🧑‍🏫 Trainer'}</span>
        <span class="hist-lvl" style="background:${c.bg};color:${c.fg}">${m.waarde}</span>
      </div>
      ${deltaHtml}
      ${intrekBtn}
    </div>`;
  }).join('')}</div>`;
}

async function intrekGeschiedenisItem(id) {
  if (!confirm('Deze trainersbeoordeling definitief verwijderen?')) return;
  await intrekkenTrainerBeoordeling(id);
  delete beoordelingCache[histHuidigePid];
  await openGeschiedenis(histHuidigePid);
  const kaart = document.getElementById('pcard-' + histHuidigePid);
  if (kaart && kaart.classList.contains('open')) renderFormulierData(histHuidigePid);
  showToast('Beoordeling ingetrokken');
}


function renderPlayerList() {
  const list = document.getElementById('player-list');
  if (!players.length) { list.innerHTML = '<div style="font-size:12px;color:var(--text3)">Nog geen spelers.</div>'; return; }
  list.innerHTML = '';
  sortedPlayers(players).forEach(p => {
    const card = document.createElement('div');
    card.className = 'card';
    card.id = 'pcard-' + p.id;
    const posTagsHtml = ALL_POS_OPTS.map(pos => {
      const active = p.posities && p.posities.includes(pos) ? ' active' : '';
      return `<span class="pos-tag${active}" onclick="togglePosTag('${p.id}','${pos}',this)">${pos}</span>`;
    }).join('');
    card.innerHTML = `
      <div class="card-hdr" onclick="this.closest('.card').classList.toggle('open'); if(this.closest('.card').classList.contains('open')) renderFormulierData('${p.id}')">
        <div style="width:28px;height:28px;border-radius:50%;background:var(--bg3);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0">⚽</div>
        <div class="card-info">
          <div class="card-title">${p.naam}</div>
          <div style="display:flex;align-items:center;gap:5px;margin-top:3px">
            ${getRolBadges(p.posities) || `<span style="font-size:11px;color:var(--text3)">${p.omschrijving || 'Geen omschrijving'}</span>`}
          </div>
        </div>
        <span class="card-chev">▾</span>
      </div>
      <div class="card-body">
        <div class="player-section">Omschrijving</div>
        <input class="player-input" id="omschr-${p.id}" placeholder="Bijv: snelle back..." value="${(p.omschrijving||'').replace(/"/g,'&quot;')}">
        <div class="player-section">Posities</div>
        <div class="pos-tags">${posTagsHtml}</div>
        <div class="player-section">Eigenschappen / aantekeningen</div>
        <textarea class="player-textarea" id="opm-${p.id}" placeholder="Sterktes, aandachtspunten...">${p.opmerkingen||''}</textarea>
        <div class="player-section">Ontwikkeling gedurende seizoen</div>
        <textarea class="player-textarea" id="ontw-${p.id}" placeholder="Week 5 — positiespel gaat beter...">${p.ontwikkeling||''}</textarea>
        <div class="player-section" style="display:flex;justify-content:space-between;align-items:center">
          <span>Spelersformulier</span>
          <span style="display:inline-flex;gap:6px">
            <button onclick="deelFormulier('${p.id}',decodeURIComponent('${encodeURIComponent(p.naam)}'))" style="padding:3px 10px;background:transparent;border:1px solid var(--accent);border-radius:12px;color:var(--accent);font-size:11px;cursor:pointer;font-family:var(--font-mono)">📲 Deel</button>
            <button onclick="wisFormulier('${p.id}')" style="padding:3px 10px;background:transparent;border:1px solid var(--red);border-radius:12px;color:var(--red);font-size:11px;cursor:pointer;font-family:var(--font-mono)" id="wisknop-${p.id}">✕ Wis</button>
          </span>
        </div>
        <div id="formulier-${p.id}" style="margin:4px 0 8px"></div>
        <div class="player-actions">
          <button class="save-btn" onclick="savePlayerData('${p.id}')">💾 Opslaan</button>
          <button class="del-btn" onclick="deletePlayer('${p.id}')">Verwijder</button>
        </div>
      </div>`;
    list.appendChild(card);
  });
}

async function onSupabaseReady() {
  const data = await loadFromSupabase();
  if (data.players) players = data.players;
  renderPlayerList();
}

renderPlayerList();
initScrollTop();
initManifest();
initSupabase().then(ok => { if (ok) onSupabaseReady(); });
</script>
