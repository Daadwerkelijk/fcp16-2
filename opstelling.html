  const k=localStorage.getItem('fcp_thema')||'groen';
  const m=t[k]||t.groen;
  const r=document.documentElement.style;
  Object.entries(m).forEach(([p,v])=>r.setProperty(p,v));
})();

        <rect x="164" y="246" width="72"  height="26" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>

<!-- Modal: speler kiezen -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-title" id="modal-title">Kies speler</div>
    <div class="modal-sub" id="modal-sub"></div>
    <div class="modal-list" id="modal-list"></div>
    <button class="modal-cancel" onclick="closeModal()">Annuleer</button>
  </div>
</div>

<script src="app.js"></script>
<script>
const state = loadState();
let players  = state.players;
let lineup   = state.lineup;
let activeFormatie = state.formatie;
let currentPosId = null;

function renderFormatieKnoppen() {
  FORMATIES = loadFormaties();
  const cont = document.getElementById('formatie-knoppen');
  cont.innerHTML = '';
  Object.entries(FORMATIES).forEach(([key, f]) => {
    const btn = document.createElement('button');
    btn.className = 'thu-uit-btn' + (key === activeFormatie ? ' active' : '');
    btn.id = 'btn-f-' + key;
    btn.textContent = f.label;
    btn.onclick = () => setFormatie(key);
    cont.appendChild(btn);
  });
}

function setFormatie(f) {
  activeFormatie = f;
  localStorage.setItem('fcp_formatie', f);
  document.querySelectorAll('#formatie-knoppen .thu-uit-btn').forEach(b => b.classList.remove('active'));
  const active = document.getElementById('btn-f-' + f);
  if (active) active.classList.add('active');
  buildField();
}

function getPositions() { return FORMATIES[activeFormatie].pos; }

function buildField() {
  const cont = document.getElementById('fieldPositions');
  cont.innerHTML = '';
  getPositions().forEach(pos => {
    const slot = document.createElement('div');
    slot.className = 'pos-slot'; slot.id = 'slot-' + pos.id;
    slot.style.left = pos.x + '%'; slot.style.top = pos.y + '%';
    slot.onclick = () => openModal(pos);
    const circle = document.createElement('div');
    circle.className = 'pos-circle' + (pos.role === 'keeper' ? ' keeper' : '');
    const init  = document.createElement('div'); init.className  = 'pos-initials'; init.id  = 'init-' + pos.id;
    const badge = document.createElement('div'); badge.className = 'pos-badge';    badge.textContent = pos.label;
    const name  = document.createElement('div'); name.className  = 'pos-name';     name.id  = 'name-' + pos.id;
    circle.appendChild(init); slot.appendChild(circle); slot.appendChild(badge); slot.appendChild(name);
    cont.appendChild(slot);
  });
  renderLineup();
}

function renderLineup() {
  getPositions().forEach(pos => {
    const pid     = lineup[pos.id];
    const circle  = document.querySelector('#slot-' + pos.id + ' .pos-circle');
    const initEl  = document.getElementById('init-' + pos.id);
    const nameEl  = document.getElementById('name-' + pos.id);
    if (!circle || !initEl || !nameEl) return;
    if (pid != null) {
      const p = players.find(pl => pl.id === pid);
      if (p) {
        circle.classList.add('filled');
        const parts = p.naam.trim().split(' ');
        initEl.textContent = parts.length > 1 ? (parts[0][0] + parts[parts.length-1][0]).toUpperCase() : p.naam.slice(0,2).toUpperCase();
        nameEl.textContent = parts[0];
        return;
      }
    }
    circle.classList.remove('filled'); initEl.textContent = '+'; nameEl.textContent = '';
  });
}

function openModal(pos) {
  currentPosId = pos.id;
  document.getElementById('modal-title').textContent = pos.label;
  document.getElementById('modal-sub').textContent   = POS_LABELS[pos.role] + ' — kies een speler';
  const list = document.getElementById('modal-list'); list.innerHTML = '';
  const emptyBtn = document.createElement('button');
  emptyBtn.className = 'modal-btn';
  emptyBtn.textContent = '— Positie leeg laten';
  emptyBtn.onclick = () => { assign(pos.id, null); closeModal(); };
  list.appendChild(emptyBtn);
  if (!players.length) {
    const d = document.createElement('div');
    d.style.cssText = 'font-size:12px;color:var(--text3);padding:8px 0';
    d.textContent = 'Geen spelers. Voeg toe via Selectie.';
    list.appendChild(d);
  } else {
    // Sorteer: spelers met passende positie eerst, dan de rest
    const posLabel = pos.label.replace('-','').toLowerCase(); // bijv 'lbl', 'cbr'
    const matched = [];
    const rest    = [];
    sortedPlayers(players).forEach(p => {
      const posities = (p.posities||[]).map(x=>x.toLowerCase().replace('-',''));
      if (posities.includes(posLabel) || posities.includes(pos.label.toLowerCase())) matched.push(p);
      else rest.push(p);
    });

    if (matched.length) {
      const hdr = document.createElement('div');
      hdr.style.cssText = 'font-size:10px;color:var(--accent);text-transform:uppercase;letter-spacing:.07em;padding:4px 0 6px';
      hdr.textContent = 'Passende positie';
      list.appendChild(hdr);
      matched.forEach(p => addPlayerBtn(list, p, pos, lineup));
      if (rest.length) {
        const sep = document.createElement('div');
        sep.style.cssText = 'border-top:1px solid var(--line2);margin:6px 0';
        list.appendChild(sep);
      }
    }
    rest.forEach(p => addPlayerBtn(list, p, pos, lineup));
  }
  document.getElementById('modalOverlay').classList.add('open');
}

function addPlayerBtn(list, p, pos, lineup) {
  const btn = document.createElement('button');
  const assignedTo = Object.entries(lineup).find(([k, v]) => v === p.id && k !== pos.id);
  const assignedLabel = assignedTo ? getPositions().find(ps => ps.id === assignedTo[0])?.label : '';
  btn.className = 'modal-btn' + (lineup[pos.id] === p.id ? ' current' : '');
  if (assignedTo && lineup[pos.id] !== p.id) btn.style.opacity = '0.45';
  btn.innerHTML = `<span>${p.naam}</span><span style="font-size:11px;color:var(--text3)">${lineup[pos.id]===p.id?'✓':assignedLabel?'→ '+assignedLabel:''}</span>`;
  btn.onclick = () => {
    if (assignedTo && lineup[pos.id] !== p.id) { showToast(p.naam + ' staat al op ' + assignedLabel); return; }
    assign(pos.id, p.id); closeModal();
  };
  list.appendChild(btn);
}

async function assign(posId, playerId) {
  lineup[posId] = playerId;
  saveLineup(lineup);
  renderLineup();
  if (supabaseReady) {
    await sbFetch('lineup?pos_id=eq.' + posId, 'DELETE');
    if (playerId) await sbFetch('lineup', 'POST', { pos_id:posId, player_id:playerId });
  }
  const pos = getPositions().find(ps => ps.id === posId);
  const p   = players.find(pl => pl.id === playerId);
  showToast(p ? p.naam + ' → ' + pos?.label : 'Positie leeggemaakt');
}

function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }

function clearLineup() {
  if (!confirm('Wis de volledige opstelling?')) return;
  lineup = {}; saveLineup(lineup); renderLineup();
  if (supabaseReady) sbFetch('lineup', 'DELETE');
  showToast('Opstelling gewist');
}

function shareWhatsApp() {
  const f = FORMATIES[activeFormatie];
  let tekst = '⚽ FCP 16-2 — Opstelling ' + f.label + '\n\n';
  f.pos.forEach(pos => {
    const p = players.find(pl => pl.id === lineup[pos.id]);
    tekst += pos.label + ': ' + (p ? p.naam : '—') + '\n';
  });
  window.open('https://wa.me/?text=' + encodeURIComponent(tekst), '_blank');
}

function saveLineupAction() {
  saveLineup(lineup);
  const f = getPositions().filter(p => lineup[p.id] != null).length;
  showToast('Opgeslagen · ' + f + '/11 posities');
}

async function onSupabaseReady() {
  const data = await loadFromSupabase();
  if (data.players) players = data.players;
  if (data.lineup)  lineup  = data.lineup;
  renderLineup();
}

// Init
FORMATIES = loadFormaties();
if (!FORMATIES[activeFormatie]) activeFormatie = Object.keys(FORMATIES)[0];
renderFormatieKnoppen();
buildField();
initScrollTop();
initManifest();
initSupabase().then(ok => { if (ok) onSupabaseReady(); });
</script>
