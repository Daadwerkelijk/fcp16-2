    'licht_blauw':{'--topbar':'#0D47A1','--topbar-dark':'#082f6e','--accent':'#1565C0','--bg':'#F0F4FF','--white':'#ffffff','--bg2':'#ffffff','--bg3':'#F0F4FF','--bg4':'#F0F4FF','--text':'#0D1B4A','--text2':'#2B4EA0','--text3':'#6B82CC','--border':'#C7D4FC','--border2':'#A8BCFA','--line':'#C7D4FC','--line2':'#A8BCFA','--red':'#D32F2F','--field-bg':'#1B5E20','--field-border':'#2E7D32','--font-ui':"'DM Sans',sans-serif",'--font-mono':"'DM Mono',monospace",'--font-display':"'DM Sans',sans-serif",'--r':'14px','--rsm':'10px','--badge-radius':'100px','--card-shadow':'0 1px 3px rgba(0,0,0,.06)'},
    'fcp':{'--topbar':'#1a1a1a','--topbar-dark':'#000000','--accent':'#F5C000','--bg':'#111111','--white':'#1e1e1e','--bg2':'#1e1e1e','--bg3':'#111111','--bg4':'#111111','--text':'#F5F5F5','--text2':'#CCCCCC','--text3':'#888888','--border':'#333333','--border2':'#444444','--line':'#333333','--line2':'#444444','--red':'#ff4444','--field-bg':'#1B5E20','--field-border':'#2E7D32','--font-ui':"'DM Sans',sans-serif",'--font-mono':"'DM Mono',monospace",'--font-display':"'DM Sans',sans-serif",'--r':'14px','--rsm':'10px','--badge-radius':'100px','--card-shadow':'none'},
    'donker':{'--topbar':'#080c14','--topbar-dark':'#030508','--accent':'#c8a840','--bg':'#080c14','--white':'#0e1524','--bg2':'#0e1524','--bg3':'#121b2e','--bg4':'#1a2540','--text':'#e8eef8','--text2':'#9aaccc','--text3':'#5a7090','--border':'#1e2e48','--border2':'#2a3e5c','--line':'#141e30','--line2':'#1e2e48','--red':'#f05050','--field-bg':'#0a1828','--field-border':'#1a3050','--font-ui':"'DM Sans',sans-serif",'--font-mono':"'DM Mono',monospace",'--font-display':"'DM Sans',sans-serif",'--r':'14px','--rsm':'10px','--badge-radius':'100px','--card-shadow':'none'}

  const k=localStorage.getItem('fcp_thema')||'licht';
  const m=T[k]||T.licht;
  const r=document.documentElement.style;
  Object.entries(m).forEach(([p,v])=>r.setProperty(p,v));
})();

<script src="app.js"></script>
<script>

const state = loadState();
let customOef  = state.customOef;
let categories = state.categories;
let activeFilter = 'alle';
let editingOefId = null;

function getCatStyle(cat) {
  return CAT_BG[cat] || { bg:'#181818', c:'#888' };
}

function setActiveFilter(val) {
  activeFilter = val;
  renderCatFilters();
  renderOef();
}

function renderCatFilters() {
  const dd = document.getElementById('cat-dropdown');
  if (dd) {
    dd.innerHTML = '<option value="alle">Alle categorieën</option>' +
      categories.map(c => `<option value="${c}" ${activeFilter===c?'selected':''}>${c}</option>`).join('');
    dd.value = activeFilter;
    // Topbar is altijd donker dus witte tekst werkt altijd
  }
}

function renderOef() {
  const all = [...BUILTIN_OEF, ...customOef];
  const filtered = activeFilter === 'alle' ? all : all.filter(o => o.cat === activeFilter);
  document.getElementById('oef-count').textContent = filtered.length + ' oefeningen';
  const list = document.getElementById('oef-list'); list.innerHTML = '';
  filtered.forEach(o => {
    const isCustom = !o.id.startsWith('b');
    const col = getCatStyle(o.cat);
    const card = document.createElement('div');
    card.className = 'oef-card'; card.id = 'ocard-' + o.id;
    const tagsHtml = (o.pr || []).map(p => { const t = PR_TAGS[p]; return t ? `<span style="font-size:10px;padding:1px 6px;border-radius:4px;background:${t.bg};color:${t.c}">${p}</span>` : ''; }).join('');
    const fmHtml = (o.formaties || []).map(k => { const f = FORMATIES[k]; return f ? `<span style="font-size:10px;padding:1px 6px;border-radius:4px;background:var(--bg3);border:1px solid var(--line2);color:var(--text2)">${f.label}</span>` : ''; }).join('');
    card.innerHTML = `
      <div class="oef-hdr" onclick="this.closest('.oef-card').classList.toggle('open')">
        <div class="oef-dot" style="background:${col.c}"></div>
        <div class="oef-meta">
          <div class="oef-title">${o.title}</div>
          <div class="oef-sub">${o.cat}${o.spelers ? ' · ' + o.spelers + ' spelers' : ''}${o.duur ? ' · ' + o.duur : ''}</div>
          ${(tagsHtml || fmHtml) ? `<div class="oef-tags" style="display:flex;flex-wrap:wrap;gap:4px">${fmHtml}${tagsHtml}</div>` : ''}
        </div>
        <span class="oef-chev">▾</span>
      </div>
      <div class="oef-body">
        ${o.desc   ? `<div class="oef-section">Omschrijving</div><div class="oef-desc">${o.desc}</div>` : ''}
        ${o.stappen?.length ? `<div class="oef-section">Stappen</div><ul class="oef-steps">${o.stappen.filter(s=>s).map(s=>`<li>${s}</li>`).join('')}</ul>` : ''}
        ${o.tip    ? `<div class="oef-tip">💡 ${o.tip}</div>` : ''}
        ${o.url    ? `<div style="margin-top:10px"><a href="${o.url}" target="_blank" rel="noopener" class="form-btn" style="display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:11px">▶️ Bekijk video</a></div>`
                   : `<div style="margin-top:8px"><a href="https://www.youtube.com/results?search_query=voetbal+oefening+${encodeURIComponent(o.title)}" target="_blank" rel="noopener" style="font-size:11px;color:var(--text3);text-decoration:none;border:1px solid var(--line2);padding:4px 10px;border-radius:var(--rsm);display:inline-block">🔍 Zoek op YouTube</a></div>`}
        ${isCustom ? `<div class="player-actions" style="margin-top:10px">
          <button class="save-btn" onclick="openOefModal('${o.id}')">✏️ Bewerken</button>
          <button class="del-btn" onclick="deleteOef('${o.id}')">Verwijder</button>
        </div>` : ''}
      </div>`;
    list.appendChild(card);
  });
}

function openOefModal(id, defaultCat) {
  editingOefId = id;
  const o = id ? customOef.find(x => x.id === id) : null;
  document.getElementById('bmodalOefTitle').textContent = o ? 'Oefening bewerken' : 'Oefening toevoegen';
  document.getElementById('oef-f-title').value   = o?.title   || '';
  document.getElementById('oef-f-spelers').value = o?.spelers || '';
  document.getElementById('oef-f-desc').value    = o?.desc    || '';
  document.getElementById('oef-f-tip').value     = o?.tip     || '';
  document.getElementById('oef-f-url').value     = o?.url     || '';
  const sel = document.getElementById('oef-f-cat'); sel.innerHTML = '';
  const useCat = o?.cat || defaultCat || categories[0] || '';
  categories.forEach(c => { const opt = document.createElement('option'); opt.value = c; opt.textContent = c; if (c === useCat) opt.selected = true; sel.appendChild(opt); });
  renderOefFormatieChips(o?.formaties || []);
  const sc = document.getElementById('oef-f-stappen'); sc.innerHTML = '';
  (o?.stappen?.length ? o.stappen : ['', '']).forEach(s => addStapWith(s));
  document.getElementById('bmodalOef').classList.add('open');
}

function renderOefFormatieChips(selected) {
  const cont = document.getElementById('oef-f-formaties'); cont.innerHTML = '';
  const fm = loadFormaties();
  Object.entries(fm).forEach(([key, f]) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.dataset.key = key;
    const active = selected.includes(key);
    btn.style.cssText = 'padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid ' + (active ? 'var(--accent)' : 'var(--line2)') + ';background:' + (active ? 'var(--accent)' : 'transparent') + ';color:' + (active ? 'var(--bg)' : 'var(--text2)');
    btn.textContent = f.label;
    btn.onclick = () => {
      const isActive = btn.style.background !== 'transparent' && btn.style.background !== '';
      const nowActive = !isActive;
      btn.style.background = nowActive ? 'var(--accent)' : 'transparent';
      btn.style.borderColor = nowActive ? 'var(--accent)' : 'var(--line2)';
      btn.style.color = nowActive ? 'var(--bg)' : 'var(--text2)';
    };
    cont.appendChild(btn);
  });
}
function getSelectedOefFormaties() {
  return [...document.querySelectorAll('#oef-f-formaties button')]
    .filter(b => b.style.background && b.style.background !== 'transparent')
    .map(b => b.dataset.key);
}

function addStap()          { addStapWith(''); }
function addStapWith(val)   {
  const row = document.createElement('div'); row.className = 'bmodal-stap-row';
  row.innerHTML = `<input class="bmodal-stap-input" value="${val.replace(/"/g,'&quot;')}" placeholder="Stap omschrijving...">
    <button class="bmodal-stap-del" onclick="this.closest('.bmodal-stap-row').remove()">✕</button>`;
  document.getElementById('oef-f-stappen').appendChild(row);
}

// Zet lokaal oef-object om naar alleen de kolommen die in Supabase bestaan
function toSbOef(o) {
  return { id:o.id, cat:o.cat, title:o.title, duur:o.duur||'', spelers:o.spelers||'', beschrijving:o.desc||o.beschrijving||'', stappen:o.stappen||[], tip:o.tip||'', url:o.url||'', formaties:o.formaties||[] };
}

async function saveOef() {
  const title = document.getElementById('oef-f-title').value.trim(); if (!title) { showToast('Vul een naam in'); return; }
  const stappen = [...document.querySelectorAll('#oef-f-stappen .bmodal-stap-input')].map(i => i.value.trim()).filter(Boolean);
  const oef = {
    id:           editingOefId || genId(),
    title,
    cat:          document.getElementById('oef-f-cat').value,
    spelers:      document.getElementById('oef-f-spelers').value.trim(),
    desc:         document.getElementById('oef-f-desc').value.trim(),
    beschrijving: document.getElementById('oef-f-desc').value.trim(),
    tip:          document.getElementById('oef-f-tip').value.trim(),
    url:          document.getElementById('oef-f-url').value.trim(),
    duur:         '',
    stappen,      pr: [],
    formaties:    getSelectedOefFormaties(),
  };
  if (editingOefId) {
    const idx = customOef.findIndex(x => x.id === editingOefId);
    if (idx >= 0) {
      customOef[idx] = oef;
      if (supabaseReady) {
        const res = await sbFetch('custom_oef?id=eq.' + editingOefId, 'PATCH', toSbOef(oef));
        if (res && res._error) showToast('⚠️ Supabase: opslaan mislukt (wordt alleen lokaal bewaard)');
      }
    }
  } else {
    customOef.push(oef);
    if (supabaseReady) {
      const res = await sbFetch('custom_oef', 'POST', toSbOef(oef));
      if (res && res._error) showToast('⚠️ Supabase: opslaan mislukt (wordt alleen lokaal bewaard)');
    }
  }
  saveCustomOef(customOef);
  closeBModalOef(); renderCatFilters(); renderOef();
  showToast(title + ' opgeslagen');
}

async function deleteOef(id) {
  const o = customOef.find(x => x.id === id);
  if (!confirm('Verwijder "' + (o?.title || 'oefening') + '"?')) return;
  customOef = customOef.filter(x => x.id !== id);
  saveCustomOef(customOef);
  if (supabaseReady) await sbFetch('custom_oef?id=eq.' + id, 'DELETE');
  renderCatFilters(); renderOef();
  showToast('Oefening verwijderd');
}

function closeBModalOef() { document.getElementById('bmodalOef').classList.remove('open'); }

function openCatModal() {
  renderCatList();
  document.getElementById('bmodalCat').classList.add('open');
}
function closeCatModal() { document.getElementById('bmodalCat').classList.remove('open'); renderCatFilters(); renderOef(); }

function renderCatList() {
  const cont = document.getElementById('cat-list'); cont.innerHTML = '';
  categories.forEach((c, i) => {
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--bg3);border:1px solid var(--line2);border-radius:var(--rsm)';
    row.innerHTML = `<span style="flex:1;font-size:12px;color:var(--text)">${c}</span>
      <button onclick="openCatEdit(${i})" style="padding:3px 8px;background:transparent;border:1px solid var(--line2);border-radius:4px;color:var(--text2);font-size:11px;cursor:pointer">✏️</button>
      <button onclick="deleteCat(${i})" style="padding:3px 8px;background:transparent;border:1px solid var(--red);border-radius:4px;color:var(--red);font-size:11px;cursor:pointer">✕</button>`;
    cont.appendChild(row);
  });
}

let editingCatIdx = null;

function openCatEdit(i) {
  editingCatIdx = i;
  document.getElementById('cat-edit-input').value = categories[i];
  document.getElementById('bmodalCatEdit').classList.add('open');
}
function closeCatEdit() { document.getElementById('bmodalCatEdit').classList.remove('open'); }

async function saveCatEdit() {
  const val = document.getElementById('cat-edit-input').value.trim();
  if (!val) { showToast('Vul een naam in'); return; }
  if (val !== categories[editingCatIdx] && categories.includes(val)) { showToast('Bestaat al'); return; }
  const oudeNaam = categories[editingCatIdx];
  // Update naam in oefeningen die deze categorie gebruiken
  customOef.forEach(o => { if (o.cat === oudeNaam) o.cat = val; });
  saveCustomOef(customOef);
  categories[editingCatIdx] = val;
  saveCategories(categories);
  if (supabaseReady) {
    await sbFetch('categories?naam=eq.' + encodeURIComponent(oudeNaam), 'PATCH', { naam: val });
    // Update ook categorie in custom_oef rijen
    await sbFetch('custom_oef?cat=eq.' + encodeURIComponent(oudeNaam), 'PATCH', { cat: val });
  }
  closeCatEdit();
  renderCatList();
  renderCatFilters();
  renderOef();
  showToast(oudeNaam + ' → ' + val);
}

async function addCat() {
  const val = document.getElementById('new-cat-input').value.trim();
  if (!val || categories.includes(val)) { showToast(val ? 'Bestaat al' : 'Vul een naam in'); return; }
  categories.push(val); saveCategories(categories);
  document.getElementById('new-cat-input').value = '';
  renderCatList(); showToast(val + ' toegevoegd');
  if (supabaseReady) {
    const res = await sbFetch('categories', 'POST', { naam:val, sort_order:categories.length });
    if (res && res._error) showToast('⚠️ Supabase: categorie niet opgeslagen (' + (res.message||res.status) + ')');
  }
}

async function deleteCat(i) {
  if (!confirm('Verwijder categorie "' + categories[i] + '"?')) return;
  const naam = categories[i];
  categories.splice(i, 1); saveCategories(categories);
  renderCatList(); showToast(naam + ' verwijderd');
  if (supabaseReady) await sbFetch('categories?naam=eq.' + encodeURIComponent(naam), 'DELETE');
}

async function onSupabaseReady() {
  const data = await loadFromSupabase();
  if (data.customOef)  customOef  = data.customOef;
  if (data.categories) {
    categories = data.categories;
  } else {
    // Supabase categories tabel is leeg — seed de huidige (lokale) categorieën eenmalig
    const seedAll = categories.map((naam, i) =>
      sbFetch('categories', 'POST', { naam, sort_order:i + 1 })
    );
    await Promise.all(seedAll);
  }
  renderCatFilters(); renderOef();
}

renderCatFilters(); renderOef();
initScrollTop(); initManifest();
initSupabase().then(ok => { if (ok) onSupabaseReady(); });
</script>
</body>
</html>
