<!-- ═══════════════════════════════════════
     LIVE WEDSTRIJD MODUS
════════════════════════════════════════ -->
<div id="live-overlay" style="display:none;position:fixed;inset:0;background:var(--bg);z-index:500;flex-direction:column;overflow:hidden">

  <!-- Header -->
  <div style="padding:48px 16px 12px;background:var(--bg2);border-bottom:1px solid var(--line2);display:flex;align-items:center;justify-content:space-between;flex-shrink:0">
    <div>
      <div style="font-size:11px;color:var(--text3);font-weight:600;letter-spacing:.08em;text-transform:uppercase">Live wedstrijd</div>
      <div style="font-size:18px;font-weight:700;color:var(--text)" id="live-tegenstander">—</div>
    </div>
    <button onclick="closeLive()" style="padding:7px 12px;background:var(--bg3);border:1px solid var(--line2);border-radius:var(--rsm);color:var(--text2);font-size:13px;cursor:pointer">✕ Sluiten</button>
  </div>

  <!-- Klok + Score -->
  <div style="padding:16px;background:var(--bg);border-bottom:1px solid var(--line2);flex-shrink:0">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <div>
        <div id="live-klok" style="font-family:var(--font-display);font-size:48px;font-weight:700;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums">00:00</div>
        <div id="live-helft-label" style="font-size:11px;color:var(--text3);margin-top:2px;font-weight:600">1e helft · 40 min</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">
        <button id="live-start-btn" onclick="toggleKlok()" style="padding:10px 18px;background:var(--accent2);border:1px solid var(--accent);border-radius:var(--rsm);color:var(--bg);font-family:var(--font-ui);font-size:14px;font-weight:700;cursor:pointer;min-width:90px">▶ Start</button>
        <button onclick="wisselHelft()" style="padding:6px 14px;background:transparent;border:1px solid var(--line2);border-radius:var(--rsm);color:var(--text2);font-family:var(--font-ui);font-size:12px;cursor:pointer">⏸ Rust / 2e helft</button>
      </div>
    </div>
    <div style="display:flex;align-items:center;justify-content:center;gap:16px">
      <div style="text-align:center">
        <div style="font-size:11px;color:var(--text3);margin-bottom:4px;font-weight:600">FCP</div>
        <div style="display:flex;align-items:center;gap:8px">
          <button onclick="scoreWijzig('eigen',-1)" style="width:36px;height:36px;background:var(--bg3);border:1px solid var(--line2);border-radius:50%;color:var(--text2);font-size:20px;cursor:pointer;line-height:1">−</button>
          <div id="live-score-eigen" style="font-family:var(--font-display);font-size:48px;font-weight:700;color:var(--text);min-width:44px;text-align:center">0</div>
          <button onclick="scoreWijzig('eigen',1)" style="width:36px;height:36px;background:var(--accent2);border:1px solid var(--accent);border-radius:50%;color:var(--bg);font-size:20px;cursor:pointer;line-height:1">+</button>
        </div>
      </div>
      <div style="font-family:var(--font-display);font-size:36px;font-weight:300;color:var(--text3)">–</div>
      <div style="text-align:center">
        <div id="live-teg-label" style="font-size:11px;color:var(--text3);margin-bottom:4px;font-weight:600">—</div>
        <div style="display:flex;align-items:center;gap:8px">
          <button onclick="scoreWijzig('tegen',-1)" style="width:36px;height:36px;background:var(--bg3);border:1px solid var(--line2);border-radius:50%;color:var(--text2);font-size:20px;cursor:pointer;line-height:1">−</button>
          <div id="live-score-tegen" style="font-family:var(--font-display);font-size:48px;font-weight:700;color:var(--text);min-width:44px;text-align:center">0</div>
          <button onclick="scoreWijzig('tegen',1)" style="width:36px;height:36px;background:var(--bg3);border:1px solid var(--line2);border-radius:50%;color:var(--text2);font-size:20px;cursor:pointer;line-height:1">+</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Notities tijdlijn -->
  <div style="flex:1;overflow-y:auto;padding:12px 16px" id="live-notities-cont">
    <div id="live-notities-lijst" style="display:flex;flex-direction:column;gap:6px;margin-bottom:12px"></div>
  </div>

  <!-- Microfoon + tekst invoer -->
  <div style="padding:12px 16px 28px;background:var(--bg2);border-top:1px solid var(--line2);flex-shrink:0">
    <div style="display:flex;gap:8px;align-items:flex-end">
      <textarea id="live-notitie-input" placeholder="Notitie intypen of 🎤 inspreekknop gebruiken..." rows="2"
        style="flex:1;padding:10px 12px;background:var(--bg3);border:1px solid var(--line2);border-radius:var(--rsm);color:var(--text);font-family:var(--font-ui);font-size:14px;outline:none;resize:none;line-height:1.5"></textarea>
      <div style="display:flex;flex-direction:column;gap:6px">
        <button id="live-mic-btn" onclick="toggleSpeech()" title="Inspreken"
          style="width:46px;height:46px;background:var(--bg3);border:1px solid var(--line2);border-radius:50%;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s">🎤</button>
        <button onclick="voegNotitieIn()" title="Toevoegen"
          style="width:46px;height:46px;background:var(--accent2);border:1px solid var(--accent);border-radius:50%;font-size:20px;cursor:pointer;color:var(--bg);font-weight:700;display:flex;align-items:center;justify-content:center">+</button>
      </div>
    </div>
    <div id="live-speech-status" style="font-size:11px;color:var(--text3);margin-top:5px;min-height:16px"></div>
  </div>
</div>

<script src="app.js"></script>
<script>
let wedstrijden = loadState().wedstrijden;
let players     = loadState().players;
let thuisUit    = 'thuis';

// ─── LIVE MODUS ───
let liveWedId=null,liveKlokSec=0,liveKlokLoopt=false,liveKlokTimer=null;
let liveHelft=1,liveMinsPerHelft=40,liveNotities=[],speechRecog=null,speechActief=false;

function openLive(id) {
  const w=wedstrijden.find(x=>x.id===id); if(!w) return;
  liveWedId=id; liveKlokSec=0; liveKlokLoopt=false; liveHelft=1; liveNotities=w.live_notities?[...w.live_notities]:[];
  const min=parseInt(prompt('Speeltijd per helft (minuten):','40'));
  if(min&&min>0) liveMinsPerHelft=min;
  document.getElementById('live-tegenstander').textContent='FCP vs '+w.tegenstander;
  document.getElementById('live-teg-label').textContent=w.tegenstander;
  document.getElementById('live-score-eigen').textContent=w.score_eigen||0;
  document.getElementById('live-score-tegen').textContent=w.score_tegen||0;
  document.getElementById('live-helft-label').textContent='1e helft · '+liveMinsPerHelft+' min';
  const btn=document.getElementById('live-start-btn');
  btn.textContent='▶ Start'; btn.style.background='var(--accent2)'; btn.style.color='var(--bg)';
  document.getElementById('live-klok').textContent='00:00';
  document.getElementById('live-notitie-input').value='';
  document.getElementById('live-speech-status').textContent='';
  renderLiveNotities();
  document.getElementById('live-overlay').style.display='flex';
  if('wakeLock' in navigator) navigator.wakeLock.request('screen').catch(()=>{});
}

function closeLive() {
  stopKlok(); stopSpeech();
  const w=wedstrijden.find(x=>x.id===liveWedId); if(w){
    w.score_eigen=parseInt(document.getElementById('live-score-eigen').textContent)||0;
    w.score_tegen=parseInt(document.getElementById('live-score-tegen').textContent)||0;
    w.live_notities=liveNotities;
    if(liveNotities.filter(n=>!n.isRust).length){
      const tekst=liveNotities.filter(n=>!n.isRust).map(n=>n.tijd+' — '+n.tekst).join('\n');
      const huidig=document.getElementById('ws-opm-'+liveWedId); if(huidig) huidig.value=tekst;
      w.opmerkingen=tekst;
    }
    saveWedstrijden(wedstrijden);
    if(supabaseReady) sbFetch('wedstrijden?id=eq.'+liveWedId,'PATCH',{score_eigen:w.score_eigen,score_tegen:w.score_tegen,opmerkingen:w.opmerkingen});
  }
  document.getElementById('live-overlay').style.display='none';
  renderWedstrijden(); showToast('Wedstrijd opgeslagen');
}

function toggleKlok(){ if(liveKlokLoopt) stopKlok(); else startKlok(); }
function startKlok(){
  liveKlokLoopt=true;
  const btn=document.getElementById('live-start-btn'); btn.textContent='⏸ Pauze'; btn.style.background='var(--bg3)'; btn.style.color='var(--text2)';
  liveKlokTimer=setInterval(()=>{ liveKlokSec++; updateKlokDisplay(); if(liveKlokSec>=liveMinsPerHelft*60) stopKlok(); },1000);
}
function stopKlok(){
  liveKlokLoopt=false; clearInterval(liveKlokTimer);
  const btn=document.getElementById('live-start-btn'); if(!btn) return;
  btn.textContent='▶ Verder'; btn.style.background='var(--accent2)'; btn.style.color='var(--bg)';
}
function wisselHelft(){
  stopKlok();
  if(liveHelft===1){
    liveHelft=2; liveKlokSec=0;
    document.getElementById('live-klok').textContent='00:00';
    document.getElementById('live-helft-label').textContent='2e helft · '+liveMinsPerHelft+' min';
    const btn=document.getElementById('live-start-btn'); btn.textContent='▶ Start'; btn.style.background='var(--accent2)'; btn.style.color='var(--bg)';
    liveNotities.push({tijd:'— rust —',tekst:'',isRust:true}); renderLiveNotities();
    showToast('2e helft — klok gereset');
  } else { showToast('Wedstrijd afgelopen'); }
}
function updateKlokDisplay(){
  const m=Math.floor(liveKlokSec/60),s=liveKlokSec%60;
  document.getElementById('live-klok').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function getKlokLabel(){ return (Math.floor(liveKlokSec/60)+(liveHelft===2?liveMinsPerHelft:0))+"'"; }

function scoreWijzig(kant,delta){
  const el=document.getElementById('live-score-'+kant);
  const nieuw=Math.max(0,(parseInt(el.textContent)||0)+delta);
  el.textContent=nieuw;
  if(delta>0) voegNotitieInMet('⚽ '+(kant==='eigen'?'FCP scoort':'Tegenstander scoort'),getKlokLabel());
}

function voegNotitieIn(){ const v=document.getElementById('live-notitie-input').value.trim(); if(!v) return; voegNotitieInMet(v,getKlokLabel()); document.getElementById('live-notitie-input').value=''; }
function voegNotitieInMet(tekst,tijd){
  liveNotities.push({tijd,tekst}); renderLiveNotities();
  setTimeout(()=>{ const c=document.getElementById('live-notities-cont'); c.scrollTop=c.scrollHeight; },50);
}
function verwijderNotitie(i){ liveNotities.splice(i,1); renderLiveNotities(); }
function renderLiveNotities(){
  const cont=document.getElementById('live-notities-lijst'); if(!cont) return;
  if(!liveNotities.length){ cont.innerHTML='<div style="font-size:13px;color:var(--text3);padding:8px 0">Nog geen notities. Start de klok en spreek in of typ hieronder.</div>'; return; }
  cont.innerHTML=liveNotities.map((n,i)=>n.isRust
    ?`<div style="text-align:center;padding:6px 0;font-size:11px;color:var(--text3);border-top:1px solid var(--line2);border-bottom:1px solid var(--line2);margin:4px 0;font-weight:700;letter-spacing:.1em">— RUST —</div>`
    :`<div style="display:flex;align-items:flex-start;gap:10px;padding:9px 11px;background:var(--bg2);border:1px solid var(--line2);border-radius:var(--rsm)">
      <span style="font-family:var(--font-display);font-size:14px;font-weight:700;color:var(--accent);flex-shrink:0;min-width:36px">${n.tijd}</span>
      <span style="flex:1;font-size:14px;color:var(--text);line-height:1.5">${n.tekst}</span>
      <button onclick="verwijderNotitie(${i})" style="background:none;border:none;color:var(--text3);cursor:pointer;font-size:14px;padding:0;flex-shrink:0;line-height:1">✕</button>
    </div>`
  ).join('');
}

function toggleSpeech(){ if(speechActief) stopSpeech(); else startSpeech(); }
function startSpeech(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ showToast('Spraakherkenning niet beschikbaar'); return; }
  speechRecog=new SR();
  speechRecog.lang='nl-NL';
  speechRecog.continuous=true;
  speechRecog.interimResults=true;

  const btn=document.getElementById('live-mic-btn'),status=document.getElementById('live-speech-status'),input=document.getElementById('live-notitie-input');
  let verwerktTotIndex=0; // bijhouden welke resultaten al verwerkt zijn

  speechRecog.onstart=()=>{
    speechActief=true;
    verwerktTotIndex=0;
    btn.style.background='var(--red)'; btn.style.borderColor='var(--red)'; btn.textContent='🔴';
    status.textContent='Luisteren...';
  };

  speechRecog.onresult=(e)=>{
    let interimTekst='';
    // Verwerk alleen nieuwe resultaten vanaf verwerktTotIndex
    for(let i=verwerktTotIndex;i<e.results.length;i++){
      const resultaat=e.results[i];
      const tekst=resultaat[0].transcript;
      if(resultaat.isFinal){
        // Definitief resultaat: toevoegen aan input en index ophogen
        input.value=(input.value+' '+tekst.trim()).trim();
        verwerktTotIndex=i+1;
      } else {
        // Tijdelijk resultaat: alleen tonen in statusbalk
        interimTekst+=tekst;
      }
    }
    status.textContent=interimTekst ? '🎤 '+interimTekst : (speechActief ? 'Luisteren...' : '');
  };

  speechRecog.onerror=(e)=>{
    if(e.error==='no-speech') return; // stilte is geen fout
    status.textContent=e.error==='not-allowed'?'⚠️ Microfoon niet toegestaan':'⚠️ '+e.error;
    stopSpeech();
  };

  // Bij continuous=true: onend kan vuren door stilte - herstart automatisch
  speechRecog.onend=()=>{
    if(speechActief){
      // Herstart na korte stilte zodat continue luisteren werkt
      try { speechRecog.start(); }
      catch(e){ stopSpeech(); }
    }
  };

  speechRecog.start();
}
function stopSpeech(){
  speechActief=false; if(speechRecog){try{speechRecog.stop();}catch(e){} speechRecog=null;}
  const btn=document.getElementById('live-mic-btn'); if(btn){btn.style.background='var(--bg3)';btn.style.borderColor='var(--line2)';btn.textContent='🎤';}
  const s=document.getElementById('live-speech-status'); if(s) s.textContent='';
}
document.addEventListener('DOMContentLoaded',()=>{
  const ta=document.getElementById('live-notitie-input');
  if(ta) ta.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();voegNotitieIn();} });
});


function setThuisUit(val) {
  thuisUit = val;
  document.getElementById('btn-thuis').classList.toggle('active', val === 'thuis');
  document.getElementById('btn-uit').classList.toggle('active',   val === 'uit');
}

async function addWedstrijd() {
  const teg = document.getElementById('wed-teg').value.trim();
  if (!teg) { showToast('Vul een tegenstander in'); return; }
  const rawDatum = document.getElementById('wed-datum').value;
  const datum = rawDatum ? formatDatumShort(rawDatum) : '';
  const w = { id:genId(), tegenstander:teg, datum, isoDate:rawDatum, thuis_uit:thuisUit, score_eigen:0, score_tegen:0, opmerkingen:'', ratings:{}, motm:null, gespeeld:false };
  if (supabaseReady) {
    // Alleen de basiskolommen sturen bij aanmaken
    const res = await sbFetch('wedstrijden', 'POST', { id:w.id, tegenstander:w.tegenstander, datum:w.datum, iso_date:w.isoDate||'', thuis_uit:w.thuis_uit, score_eigen:0, score_tegen:0, opmerkingen:'', gespeeld:false });
    if (!res || res._error) { showToast('Opslaan mislukt — ' + (res?.message||'check Supabase')); return; }
  }
  wedstrijden.push(w);
  saveWedstrijden(wedstrijden);
  renderWedstrijden();
  document.getElementById('wed-teg').value = '';
  document.getElementById('wed-datum').value = '';
  showToast(teg + ' toegevoegd');
}

async function saveWedstrijd(id) {
  const w = wedstrijden.find(x => x.id === id); if (!w) return;
  w.score_eigen = parseInt(document.getElementById('ws-eigen-' + id).value) || 0;
  w.score_tegen = parseInt(document.getElementById('ws-tegen-' + id).value) || 0;
  w.opmerkingen = document.getElementById('ws-opm-' + id).value;
  w.motm        = document.getElementById('ws-motm-' + id).value || null;
  w.formatie    = document.getElementById('ws-form-' + id).value || null;
  if (!w.ratings) w.ratings = {};
  players.forEach(p => {
    const el = document.getElementById('rat-' + id + '-' + p.id);
    if (el && el.value) w.ratings[p.id] = parseFloat(el.value);
    else if (el) delete w.ratings[p.id];
  });
  saveWedstrijden(wedstrijden);
  if (supabaseReady) {
    await sbFetch('wedstrijden?id=eq.' + id, 'PATCH', {
      score_eigen: w.score_eigen,
      score_tegen: w.score_tegen,
      opmerkingen: w.opmerkingen,
      ratings:     JSON.stringify(w.ratings || {}),
      motm:        w.motm || null,
    });
  }
  renderRanking();
  showToast('Wedstrijd opgeslagen');
}

async function deleteWedstrijd(id) {
  const w = wedstrijden.find(x => x.id === id);
  if (!confirm('Verwijder ' + (w ? w.tegenstander : 'wedstrijd') + '?')) return;
  wedstrijden = wedstrijden.filter(x => x.id !== id);
  saveWedstrijden(wedstrijden);
  if (supabaseReady) await sbFetch('wedstrijden?id=eq.' + id, 'DELETE');
  renderWedstrijden();
  showToast('Wedstrijd verwijderd');
}

function setMotm(wedId, playerId) {
  const w = wedstrijden.find(x => x.id === wedId); if (!w) return;
  w.motm = w.motm === playerId ? null : playerId;
  saveWedstrijden(wedstrijden);
  if (supabaseReady) sbFetch('wedstrijden?id=eq.' + wedId, 'PATCH', { motm: w.motm || null });
  renderWedstrijden();
  renderRanking();
  const p = players.find(pl => pl.id === playerId);
  showToast(w.motm ? '⭐ MOTM: ' + (p ? p.naam : '') : 'MOTM verwijderd');
}

let editWedId = null;
let editThuisUit = 'thuis';

function setEditThuisUit(val) {
  editThuisUit = val;
  document.getElementById('edit-btn-thuis').classList.toggle('active', val === 'thuis');
  document.getElementById('edit-btn-uit').classList.toggle('active', val === 'uit');
}
function openEditWed(id) {
  const w = wedstrijden.find(x => x.id === id); if (!w) return;
  editWedId = id;
  document.getElementById('edit-wed-teg').value = w.tegenstander || '';
  // Probeer datum terug te parsen naar ISO formaat
  document.getElementById('edit-wed-datum').value = w.isoDate || '';
  editThuisUit = w.thuis_uit || 'thuis';
  setEditThuisUit(editThuisUit);
  document.getElementById('bmodalEditWed').classList.add('open');
}
function closeEditWed() {
  document.getElementById('bmodalEditWed').classList.remove('open');
}
async function saveEditWed() {
  const w = wedstrijden.find(x => x.id === editWedId); if (!w) return;
  const teg = document.getElementById('edit-wed-teg').value.trim();
  if (!teg) { showToast('Vul een tegenstander in'); return; }
  const rawDatum = document.getElementById('edit-wed-datum').value;
  w.tegenstander = teg;
  w.isoDate = rawDatum;
  w.datum = rawDatum ? formatDatumShort(rawDatum) : w.datum;
  w.thuis_uit = editThuisUit;
  saveWedstrijden(wedstrijden);
  if (supabaseReady) {
    await sbFetch('wedstrijden?id=eq.' + editWedId, 'PATCH', {
      tegenstander: w.tegenstander, datum: w.datum, iso_date: w.isoDate||'', thuis_uit: w.thuis_uit
    });
  }
  closeEditWed();
  renderWedstrijden();
  showToast('Wedstrijd bijgewerkt');
}

function wedCategorie(w) {
  if (w.gespeeld) return 'gespeeld';
  const nu = new Date(); nu.setHours(0,0,0,0);
  let d = w.isoDate ? new Date(w.isoDate) : null;
  if (!d) return 'toekomst';
  const diff = d - nu;
  if (diff < 0) return 'volgend'; // datum voorbij maar niet bevestigd gespeeld
  if (diff < 7 * 24 * 60 * 60 * 1000) return 'volgend';
  return 'toekomst';
}

async function markeerGespeeld(id) {
  const w = wedstrijden.find(x => x.id === id); if (!w) return;
  w.gespeeld = true;
  saveWedstrijden(wedstrijden);
  if (supabaseReady) await sbFetch('wedstrijden?id=eq.' + id, 'PATCH', { gespeeld: true });
  renderWedstrijden();
  showToast('Wedstrijd gemarkeerd als gespeeld');
}

function renderWedstrijden() {
  const list = document.getElementById('wed-list');
  if (!wedstrijden.length) { list.innerHTML = '<div style="font-size:12px;color:var(--text3)">Nog geen wedstrijden.</div>'; return; }
  list.innerHTML = '';

  const gespeeld  = wedstrijden.filter(w => wedCategorie(w) === 'gespeeld');
  const volgend   = wedstrijden.filter(w => wedCategorie(w) === 'volgend');
  const toekomst  = wedstrijden.filter(w => wedCategorie(w) === 'toekomst');

  function renderGroep(titel, kleur, border, lijst, omgekeerd = false) {
    if (!lijst.length) return;
    const hdr = document.createElement('div');
    hdr.style.cssText = `font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:${kleur};margin:14px 0 6px;padding-left:2px;display:flex;align-items:center;gap:8px`;
    hdr.innerHTML = `<span style="width:8px;height:8px;border-radius:50%;background:${kleur};flex-shrink:0"></span>${titel}`;
    list.appendChild(hdr);
    const groep = omgekeerd ? [...lijst].reverse() : lijst;
    groep.forEach(w => {
      const card = document.createElement('div');
      card.className = 'card'; card.id = 'wcard-' + w.id;
      card.style.borderLeft = `3px solid ${border}`;
      const rc = w.score_eigen > w.score_tegen ? 'var(--accent)' : w.score_eigen < w.score_tegen ? 'var(--red)' : 'var(--text3)';
      const rl = w.score_eigen > w.score_tegen ? 'W' : w.score_eigen < w.score_tegen ? 'V' : 'G';
      const motmP = w.motm ? players.find(p => p.id === w.motm) : null;
    const motmOptions = sortedPlayers(players).map(p =>
      `<option value="${p.id}" ${w.motm===p.id?'selected':''}>${p.naam}</option>`
    ).join('');
    const lineupOpties = Object.keys(FORMATIES).map(f =>
      `<option value="${f}" ${w.formatie===f?'selected':''}>${FORMATIES[f].label}</option>`
    ).join('');
    const ratingsHtml = players.length ? `
      <div style="font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin:10px 0 6px">Spelersbeoordelingen (1–10)</div>
      <div style="display:flex;flex-direction:column;gap:5px;margin-bottom:8px">
        ${sortedPlayers(players).map(p => {
          const rating = w.ratings && w.ratings[p.id] || '';
          return `<div style="display:flex;align-items:center;gap:8px">
            <span style="flex:1;font-size:12px;color:var(--text)">${p.naam}</span>
            <input type="number" min="1" max="10" step="0.5" placeholder="—" value="${rating}"
              id="rat-${w.id}-${p.id}"
              style="width:52px;padding:4px 6px;background:var(--bg3);border:1px solid var(--line2);border-radius:4px;color:var(--accent);font-family:var(--font-display);font-size:16px;font-weight:600;text-align:center;outline:none">
          </div>`;
        }).join('')}
      </div>` : '';
      card.innerHTML = `
      <div class="card-hdr" onclick="this.closest('.card').classList.toggle('open')">
        <div class="wed-score-big" style="color:${rc}">${w.score_eigen}–${w.score_tegen}</div>
        <div class="card-info">
          <div class="card-title">${w.tegenstander}</div>
          <div class="card-sub">${w.datum||'–'} · ${w.thuis_uit} · <span style="color:${rc}">${rl}</span>${motmP ? ' · ⭐ '+motmP.naam : ''}</div>
        </div>
        <button onclick="event.stopPropagation();openEditWed('${w.id}')" style="padding:4px 8px;background:transparent;border:1px solid var(--line2);border-radius:var(--rsm);color:var(--text3);font-size:11px;cursor:pointer;flex-shrink:0">✏️</button>
        <span class="card-chev" style="margin-left:4px">▾</span>
      </div>
      <div class="card-body">
        <div style="font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">Eindstand</div>
        <div class="wed-score-row">
          <input class="wed-score-input" id="ws-eigen-${w.id}" type="number" min="0" max="99" value="${w.score_eigen}">
          <span class="wed-score-sep">–</span>
          <input class="wed-score-input" id="ws-tegen-${w.id}" type="number" min="0" max="99" value="${w.score_tegen}">
          <span style="font-size:11px;color:var(--text3);margin-left:6px">FCP – ${w.tegenstander}</span>
        </div>
        <div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap">
          <div style="flex:1;min-width:130px">
            <div style="font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px">Formatie</div>
            <select id="ws-form-${w.id}" style="width:100%;padding:8px;background:var(--bg3);border:1px solid var(--line2);border-radius:var(--rsm);color:var(--text);font-family:var(--font-mono);font-size:12px;outline:none">
              <option value="">— geen —</option>${lineupOpties}
            </select>
          </div>
          <div style="flex:1;min-width:130px">
            <div style="font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px">Man of the Match ⭐</div>
            <select id="ws-motm-${w.id}" style="width:100%;padding:8px;background:var(--bg3);border:1px solid var(--line2);border-radius:var(--rsm);color:var(--text);font-family:var(--font-mono);font-size:12px;outline:none">
              <option value="">— geen —</option>${motmOptions}
            </select>
          </div>
        </div>
        ${ratingsHtml}
        <div style="font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px">Opmerkingen</div>
        <textarea style="width:100%;padding:8px 11px;background:var(--bg3);border:1px solid var(--line2);border-radius:var(--rsm);color:var(--text);font-family:var(--font-mono);font-size:12px;outline:none;resize:vertical;min-height:65px;line-height:1.5" id="ws-opm-${w.id}" placeholder="Hoe verliep de wedstrijd?">${w.opmerkingen||''}</textarea>
        <div class="player-actions">
          <button class="save-btn" style="background:var(--accent2);border-color:var(--accent);color:var(--bg)" onclick="openLive('${w.id}')">▶ Live</button>
          <button class="save-btn" onclick="saveWedstrijd('${w.id}')">💾 Opslaan</button>
          ${!w.gespeeld ? `<button class="save-btn" style="background:transparent;border-color:var(--accent);color:var(--accent)" onclick="markeerGespeeld('${w.id}')">✓ Gespeeld</button>` : '<span style="font-size:11px;color:var(--accent)">✓ Gespeeld</span>'}
          <button class="del-btn" onclick="deleteWedstrijd('${w.id}')">Verwijder</button>
        </div>
      </div>`;
      list.appendChild(card);
    });
  }

  renderGroep('Eerstvolgende', 'var(--accent)', 'var(--accent)', volgend);
  renderGroep('Toekomstige wedstrijden', 'var(--text3)', 'var(--line2)', toekomst);
  renderGroep('Gespeeld', 'var(--text3)', 'var(--line)', gespeeld, true);
  renderRanking();
}

function renderRanking() {
  const cont = document.getElementById('ranking-cont'); if (!cont) return;
  if (!players.length || !wedstrijden.length) { cont.innerHTML = '<div style="font-size:12px;color:var(--text3)">Voeg spelers en wedstrijden toe.</div>'; return; }
  const ratingMap = {}; const motmMap = {};
  sortedPlayers(players).forEach(p => { ratingMap[p.id] = {sum:0,count:0}; motmMap[p.id] = 0; });
  wedstrijden.forEach(w => {
    if (w.ratings) Object.entries(w.ratings).forEach(([pid,val]) => { if (ratingMap[pid]) { ratingMap[pid].sum += val; ratingMap[pid].count++; } });
    if (w.motm && motmMap[w.motm] !== undefined) motmMap[w.motm]++;
  });
  const ranked = sortedPlayers(players).map(p => ({ p, avg: ratingMap[p.id].count ? Math.round(ratingMap[p.id].sum/ratingMap[p.id].count*10)/10 : null, count: ratingMap[p.id].count, motm: motmMap[p.id] })).filter(x => x.avg !== null || x.motm > 0).sort((a,b) => (b.avg||0)-(a.avg||0));
  const motmRanked = sortedPlayers(players).map(p => ({ p, motm: motmMap[p.id] })).filter(x => x.motm > 0).sort((a,b) => b.motm - a.motm);
  let html = '';
  if (ranked.length) {
    html += `<div style="font-family:var(--font-display);font-size:15px;font-weight:600;color:var(--text);margin-bottom:8px">Gemiddeld cijfer</div>`;
    ranked.forEach((x,i) => {
      const col = x.avg>=8?'#40f090':x.avg>=6.5?'#a8e040':x.avg>=5?'#f0c040':'#f07040';
      html += `<div style="display:flex;align-items:center;gap:8px;margin-bottom:7px">
        <span style="font-size:11px;color:var(--text3);min-width:16px">${i+1}</span>
        <span style="flex:1;font-size:13px;color:var(--text)">${x.p.naam}</span>
        <span style="font-size:11px;color:var(--text3)">${x.count}×</span>
        <span style="font-family:var(--font-display);font-size:18px;font-weight:600;color:${col};min-width:32px;text-align:right">${x.avg||'—'}</span>
      </div>`;
    });
  }
  if (motmRanked.length) {
    html += `<div style="font-family:var(--font-display);font-size:15px;font-weight:600;color:var(--text);margin:16px 0 8px;padding-top:12px;border-top:1px solid var(--line2)">Man of the Match</div>`;
    motmRanked.forEach((x,i) => {
      html += `<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
        <span style="font-size:11px;color:var(--text3);min-width:16px">${i+1}</span>
        <span style="flex:1;font-size:13px;color:var(--text)">${x.p.naam}</span>
        <span style="font-size:13px;color:#f0c040">⭐ × ${x.motm}</span>
      </div>`;
    });
  }
  if (!html) html = '<div style="font-size:12px;color:var(--text3)">Nog geen beoordelingen ingevuld.</div>';
  cont.innerHTML = html;
}

async function onSupabaseReady() {
  const data = await loadFromSupabase();
  if (data.players)     players     = data.players;
  if (data.wedstrijden) wedstrijden = data.wedstrijden;
  renderWedstrijden();
}

renderWedstrijden();
initScrollTop();
initManifest();
initSupabase().then(ok => { if (ok) onSupabaseReady(); });
</script>
</body>
</html>
