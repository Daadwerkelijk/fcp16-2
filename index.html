<script>
const state = loadState();
let principes = state.principes || DEFAULT_PRINCIPES;
let activePrId = null;

// Weekdag herkend in de sessienaam ("maandag") -> exacte datum. Anders (bv. "Training 1",
// "Training 2") -> een schatting: trainingen staan doorgaans ~2 dagen uit elkaar
// (bv. maandag/woensdag), dus de 1e sessie van de week krijgt dag 0, de 2e dag 2, enz.
// Zonder dit kregen alle ongedateerde sessies dezelfde (week-start-)datum, waardoor
// een al verstreken 1e training de eerstvolgende training kon blijven overschaduwen.
function sessieDatum(weekIsoDate, sessie, si) {
  const DAGMAP = {maandag:0,dinsdag:1,woensdag:2,donderdag:3,vrijdag:4,zaterdag:5,zondag:6};
  const dagTxt = (sessie.dag||'').toLowerCase();
  const dagEntry = Object.entries(DAGMAP).find(([d]) => dagTxt.includes(d));
  const offset = dagEntry ? dagEntry[1] : si * 2;
  const d = new Date(weekIsoDate);
  d.setDate(d.getDate() + offset);
  return d;
}
function isoVan(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function renderStartCards() {
  const weken = JSON.parse(localStorage.getItem('fcp_custom_weken') || '[]');
  const trainCard = document.getElementById('start-training-card');
  const today = new Date();
  const todayDag = today.getFullYear()*10000 + (today.getMonth()+1)*100 + today.getDate();

  if (trainCard) {
    let gevondenWeek = null, gevondenSessie = null, gevondenWi = -1, gevondenSi = -1, gevondenDatumIso = '';
    const gesorteerd = weken.map((w,i)=>({w,i})).filter(x=>x.w.isoDate).sort((a,b)=>a.w.isoDate.localeCompare(b.w.isoDate));
    for (const {w, i} of gesorteerd) {
      if (!w.isoDate || !w.sessies || !w.sessies.length) continue;
      for (let si = 0; si < w.sessies.length; si++) {
        const s = w.sessies[si];
        const sessieD = sessieDatum(w.isoDate, s, si);
        const sessieDag = sessieD.getFullYear()*10000 + (sessieD.getMonth()+1)*100 + sessieD.getDate();
        if (sessieDag >= todayDag) {
          gevondenWeek = w; gevondenWi = i;
          gevondenSessie = s; gevondenSi = si;
          gevondenDatumIso = isoVan(sessieD);
          break;
        }
      }
      if (gevondenSessie) break;
    }
    if (gevondenWeek && gevondenSessie) {
      const nk = 'cw' + gevondenWi + '_' + gevondenSi;
      const url = 'trainen.html#' + nk;
      const aanw = JSON.parse(localStorage.getItem('fcp_aanw')||'{}');
      const aanwData = aanw[nk] || {};
      const spelers = JSON.parse(localStorage.getItem('fcp_players')||'[]');
      const afwNum = Object.values(aanwData).filter(v=>v&&v.afwezig).length;
      const aanwNum = spelers.length - afwNum;
      const dagNaam = gevondenSessie.dag || 'Training';
      const teller = spelers.length > 0 ? (aanwNum + '/' + spelers.length) : '–';
      const datumTxt = formatDatumVol(gevondenDatumIso);
      trainCard.innerHTML = '<a href="' + url + '" style="display:block;background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:13px 14px;margin-bottom:10px;text-decoration:none;box-shadow:var(--card-shadow)">'
        + '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">'
        + '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--topbar)" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 10v3.5l2 1.5"/><path d="M10 2h4"/><path d="M12 2v2.5"/></svg>'
        + '<div style="font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.07em">Eerstvolgende training</div>'
        + '</div>'
        + '<div style="font-size:16px;font-weight:700;color:var(--text);margin-bottom:4px">' + dagNaam + '</div>'
        + '<div style="font-size:11px;color:var(--text3);margin-bottom:8px">' + datumTxt + '</div>'
        + '<div style="display:flex;justify-content:flex-end">'
        + '<span style="background:var(--topbar);color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:100px">' + teller + '</span>'
        + '</div>'
        + '</a>';
    } else {
      trainCard.innerHTML = '';
    }
  }

  const wedCard = document.getElementById('start-wedstrijd-card');
  const wedstrijden = JSON.parse(localStorage.getItem('fcp_wed') || '[]');
  if (wedCard) {
    const vandaagIso = today.getFullYear() + '-' +
      String(today.getMonth()+1).padStart(2,'0') + '-' +
      String(today.getDate()).padStart(2,'0');
    const komend = wedstrijden.filter(w => !w.gespeeld && w.isoDate).sort((a,b) => a.isoDate.localeCompare(b.isoDate));
    const eersteKomend = komend.find(w => w.isoDate >= vandaagIso) || komend[0];
    if (eersteKomend) {
      const w = eersteKomend;
      const sp = JSON.parse(localStorage.getItem('fcp_players')||'[]');
      const afw = (w.afwezig||[]).length;
      const aanwTeller = sp.length > 0 ? ((sp.length - afw) + '/' + sp.length) : '–';
      const thuisTeam = w.thuis_uit === 'thuis' ? 'FCP JO16-2' : (w.tegenstander||'?');
      const uitTeam = w.thuis_uit === 'thuis' ? (w.tegenstander||'?') : 'FCP JO16-2';
      const datumTekst = (w.datum||'–') + (w.starttijd ? ' · ' + w.starttijd : '') + ' · ' + (w.thuis_uit||'–');
      const bolSvg = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.9)" stroke-width="2"><circle cx="12" cy="12" r="9.5"/><path d="M12 2.5c0 0-3 3.5-3 9.5s3 9.5 3 9.5"/><path d="M12 2.5c0 0 3 3.5 3 9.5s-3 9.5-3 9.5"/><line x1="2.5" y1="9" x2="21.5" y2="9"/><line x1="2.5" y1="15" x2="21.5" y2="15"/></svg>';
      const teamDiv = function(naam) {
        return '<div style="text-align:center;flex:1">'
          + '<div style="width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.15);margin:0 auto 4px;display:flex;align-items:center;justify-content:center">' + bolSvg + '</div>'
          + '<div style="font-size:12px;font-weight:700;color:#fff">' + naam + '</div>'
          + '</div>';
      };
      wedCard.innerHTML = '<a href="wedstrijden.html" style="display:block;background:linear-gradient(135deg,var(--topbar) 0%,color-mix(in srgb,var(--topbar) 70%,#000) 100%);border-radius:var(--r);padding:13px;margin-bottom:10px;text-decoration:none;box-shadow:var(--card-shadow)">'
        + '<div style="font-size:9px;font-weight:700;color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px">Eerstvolgende wedstrijd</div>'
        + '<div style="display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:8px">'
        + teamDiv(thuisTeam)
        + '<div style="font-size:14px;font-weight:700;color:rgba(255,255,255,.6);flex-shrink:0">vs</div>'
        + teamDiv(uitTeam)
        + '</div>'
        + '<div style="display:flex;align-items:center;justify-content:space-between">'
        + '<div style="font-size:10px;color:rgba(255,255,255,.6)">' + datumTekst + '</div>'
        + '<span style="background:rgba(255,255,255,.2);color:#fff;font-size:10px;font-weight:700;padding:3px 9px;border-radius:100px">' + aanwTeller + '</span>'
        + '</div>'
        + '</a>';
    } else {
      wedCard.innerHTML = '';
    }
  }
}

const AGENDA_MAANDNAMEN = ['jan.','feb.','mrt.','apr.','mei','jun.','jul.','aug.','sep.','okt.','nov.','dec.'];
const AGENDA_WEEKDAGNAMEN = ['Zo','Ma','Di','Wo','Do','Vr','Za'];
const AGENDA_ICOON_WEDSTRIJD = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v7a4 4 0 0 1-8 0z"/><path d="M8 7H5a2 2 0 0 0 2 3.8"/><path d="M16 7h3a2 2 0 0 1-2 3.8"/><line x1="12" y1="15" x2="12" y2="19"/><line x1="9" y1="19" x2="15" y2="19"/></svg>';
const AGENDA_ICOON_TRAINING = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 10v3.5l2 1.5"/><path d="M10 2h4"/><path d="M12 2v2.5"/><path d="M19 5l1.5 1.5"/></svg>';
let agendaFilter = 'alle';

function getAgendaItems() {
  const todayIso = isoVan(new Date());
  const items = [];
  const spelers = JSON.parse(localStorage.getItem('fcp_players') || '[]');
  const aanwAlles = JSON.parse(localStorage.getItem('fcp_aanw') || '{}');
  // "aanwezig/totaal" o.b.v. de echte afwezigheid die per wedstrijd/training is
  // ingevuld — geen los telveld, dus altijd in sync met wat er op de wedstrijd-
  // of trainingspagina zelf staat.
  const aanwezigTxt = afwezigAantal => spelers.length ? (spelers.length - afwezigAantal) + '/' + spelers.length : '';

  const wedstrijden = JSON.parse(localStorage.getItem('fcp_wed') || '[]');
  wedstrijden.filter(w => !w.gespeeld && w.isoDate && w.isoDate >= todayIso).forEach(w => {
    const wedTypeLabel = w.wed_type === 'beker' ? 'Beker' : w.wed_type === 'oefenwedstrijd' ? 'Oefenwedstrijd' : 'Competitie';
    items.push({
      type: 'wedstrijd',
      isoDate: w.isoDate,
      tijd: w.starttijd || '',
      titel: 'Wedstrijd vs ' + (w.tegenstander || '?'),
      pillLabel: wedTypeLabel,
      sub: (w.thuis_uit === 'uit' ? 'Uit' : 'Thuis') + (w.starttijd ? ' - Aanvang: ' + w.starttijd : ''),
      aanwezig: aanwezigTxt((w.afwezig || []).length),
      href: 'wedstrijden.html#wed-' + w.id
    });
  });

  const weken = JSON.parse(localStorage.getItem('fcp_custom_weken') || '[]');
  weken.forEach((w, wi) => {
    if (!w.isoDate || !w.sessies) return;
    w.sessies.forEach((s, si) => {
      const d = sessieDatum(w.isoDate, s, si);
      const iso = isoVan(d);
      if (iso < todayIso) return;
      const nk = 'cw' + wi + '_' + si;
      const afwNum = Object.values(aanwAlles[nk] || {}).filter(v => v && v.afwezig).length;
      items.push({
        type: 'training',
        isoDate: iso,
        tijd: '',
        titel: s.dag || 'Training',
        pillLabel: 'Training',
        sub: '',
        aanwezig: aanwezigTxt(afwNum),
        href: 'trainen.html#' + nk
      });
    });
  });

  items.sort((a, b) => a.isoDate.localeCompare(b.isoDate) || a.tijd.localeCompare(b.tijd));
  return items;
}

function renderAgenda() {
  const items = getAgendaItems();
  const subEl = document.getElementById('agenda-card-sub');
  if (subEl) subEl.textContent = items.length ? items.length + ' aankomend' : 'Niets gepland';

  const list = document.getElementById('agenda-list');
  if (!list) return;
  const gefilterd = items.filter(a => agendaFilter === 'alle' || a.type === agendaFilter);
  if (!gefilterd.length) {
    list.innerHTML = '<div style="text-align:center;color:var(--text3);font-size:13px;padding:20px 0">Niets gepland</div>';
    return;
  }
  list.innerHTML = gefilterd.map(a => {
    const isWed = a.type === 'wedstrijd';
    const stripe = isWed ? 'var(--rood)' : 'var(--blauw)';
    const iconBg = isWed ? 'var(--rood-l)' : 'var(--blauw-l)';
    const pillBg = isWed ? 'var(--rood-l)' : 'var(--blauw-l)';
    const icoon = isWed ? AGENDA_ICOON_WEDSTRIJD : AGENDA_ICOON_TRAINING;
    const d = new Date(a.isoDate);
    const maand = AGENDA_MAANDNAMEN[d.getMonth()];
    const weekdag = AGENDA_WEEKDAGNAMEN[d.getDay()];
    return '<a class="item agenda-item" href="' + a.href + '" style="border-left-color:' + stripe + ';text-decoration:none">'
      + '<div class="agenda-datum">'
      + '<div class="agenda-maand">' + maand + '</div>'
      + '<div class="agenda-daynum">' + d.getDate() + '</div>'
      + '<div class="agenda-weekdag">' + weekdag + '</div>'
      + '</div>'
      + '<div class="item-icon" style="background:' + iconBg + ';color:' + stripe + '">' + icoon + '</div>'
      + '<div class="item-info">'
      + '<div class="item-name">' + a.titel + '</div>'
      + '<div class="agenda-pill" style="background:' + pillBg + ';color:' + stripe + '">' + a.pillLabel + '</div>'
      + (a.sub ? '<div class="item-sub">' + a.sub + '</div>' : '')
      + '</div>'
      + (a.aanwezig ? '<div class="item-right">' + a.aanwezig + '</div>' : '')
      + '<div class="chev">›</div>'
      + '</a>';
  }).join('');
}

document.querySelectorAll('[data-agenda-filter]').forEach(function(btn) {
  btn.addEventListener('click', function(e) {
    e.stopPropagation();
    document.querySelectorAll('[data-agenda-filter]').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    agendaFilter = btn.dataset.agendaFilter;
    renderAgenda();
  });
});

function updateStats() {
  const wed = JSON.parse(localStorage.getItem('fcp_wed')||'[]');
  const pl  = JSON.parse(localStorage.getItem('fcp_players')||'[]');
  const oef = JSON.parse(localStorage.getItem('fcp_oef')||'[]');
  const doelsaldo = wed.reduce((s,w) => s + (w.score_eigen||0) - (w.score_tegen||0), 0);
  document.getElementById('stat-wedstrijden').textContent = wed.length;
  document.getElementById('stat-spelers').textContent     = pl.length;
  document.getElementById('stat-oef').textContent         = oef.length;
  document.getElementById('stat-wins').textContent        = wed.filter(w=>w.gespeeld && w.score_eigen>w.score_tegen).length;
  const gelijkEl = document.getElementById('stat-gelijk');
  if (gelijkEl) gelijkEl.textContent = wed.filter(w=>w.gespeeld && w.score_eigen===w.score_tegen).length;
  const verlorenEl = document.getElementById('stat-verloren');
  if (verlorenEl) verlorenEl.textContent = wed.filter(w=>w.gespeeld && w.score_eigen<w.score_tegen).length;
  const saldoEl = document.getElementById('stat-doelsaldo');
  if (saldoEl) {
    saldoEl.textContent = (doelsaldo > 0 ? '+' : '') + doelsaldo;
  }
}

function applyTeamConfig(cfg) {
  const c = cfg || loadTeamInstellingen();
  const titel = document.getElementById('home-titel');
  const sub   = document.getElementById('home-subtitel');
  if (titel) {
    const delen = c.naam.split(' ');
    titel.innerHTML = delen.length > 1
      ? delen.slice(0,-1).join(' ') + ' <em>' + delen[delen.length-1] + '</em>'
      : '<em>' + c.naam + '</em>';
  }
  if (sub) sub.textContent = c.subtitel || '';
}

function renderPrincipes() {
  const grid = document.getElementById('principle-grid');
  if (!grid) return;
  const kleuren = [
    {bg:'var(--white)',border:'var(--border)',codeClr:'var(--accent)',nameClr:'var(--text2)'},
    {bg:'var(--white)',border:'var(--border)',codeClr:'var(--accent)',nameClr:'var(--text2)'},
    {bg:'var(--white)',border:'var(--border)',codeClr:'var(--accent)',nameClr:'var(--text2)'},
    {bg:'var(--white)',border:'var(--border)',codeClr:'var(--accent)',nameClr:'var(--text2)'},
    {bg:'var(--white)',border:'var(--border)',codeClr:'var(--accent)',nameClr:'var(--text2)'},
    {bg:'var(--white)',border:'var(--border)',codeClr:'var(--accent)',nameClr:'var(--text2)'},
  ];
  grid.innerHTML = principes.map((p,i) => {
    const k = kleuren[i % kleuren.length];
    return `<div style="background:${k.bg};border:1px solid ${k.border};border-radius:12px;padding:10px 12px;cursor:pointer" onclick="openPrModal('${p.id}')">
      <div style="font-size:18px;font-weight:800;color:${k.codeClr};line-height:1;margin-bottom:4px">${p.code}</div>
      <div style="font-size:12px;font-weight:600;color:${k.nameClr};line-height:1.3">${p.naam}</div>
    </div>`;
  }).join('');
}


function openPrModal(id) {
  const p = principes.find(x => x.id === id); if (!p) return;
  activePrId = id;
  document.getElementById('pr-code').textContent     = p.code;
  document.getElementById('pr-naam').textContent     = p.naam;
  document.getElementById('pr-desc').textContent     = p.beschrijving;
  document.getElementById('pr-voorbeeld').textContent = p.voorbeeld;
  document.getElementById('prModalOverlay').classList.add('open');
}
function closePrModal() { document.getElementById('prModalOverlay').classList.remove('open'); }

function openPrEdit() {
  const p = principes.find(x => x.id === activePrId); if (!p) return;
  document.getElementById('pr-edit-title').textContent = p.code + ' bewerken';
  document.getElementById('pr-f-naam').value      = p.naam;
  document.getElementById('pr-f-desc').value      = p.beschrijving;
  document.getElementById('pr-f-voorbeeld').value = p.voorbeeld;
  closePrModal();
  document.getElementById('bmodalPr').classList.add('open');
}
function closePrEdit() { document.getElementById('bmodalPr').classList.remove('open'); }

async function savePr() {
  const p = principes.find(x => x.id === activePrId); if (!p) return;
  p.naam        = document.getElementById('pr-f-naam').value;
  p.beschrijving = document.getElementById('pr-f-desc').value;
  p.voorbeeld   = document.getElementById('pr-f-voorbeeld').value;
  localStorage.setItem('fcp_principes', JSON.stringify(principes));
  if (supabaseReady) {
    const res = await updatePrincipe(p.id, { naam:p.naam, beschrijving:p.beschrijving, voorbeeld:p.voorbeeld });
    if (res && res._error) { renderPrincipes(); closePrEdit(); return; }
  }
  renderPrincipes();
  closePrEdit();
  showToast(p.code + ' opgeslagen');
}

async function onSupabaseReady() {
  const data = await loadFromSupabase();
  if (data.principes) { principes = data.principes; localStorage.setItem('fcp_principes', JSON.stringify(principes)); }
  if (data.teamConfig) applyTeamConfig(data.teamConfig);
  renderPrincipes();
  updateStats();
  renderStartCards();
  renderAgenda();
}

// Init
applyTeamConfig();
principes = JSON.parse(localStorage.getItem('fcp_principes') || JSON.stringify(DEFAULT_PRINCIPES));
renderPrincipes();
updateStats();
renderStartCards();
renderAgenda();
initScrollTop();
initManifest();
initSupabase().then(ok => { if (ok) onSupabaseReady(); });
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/fcp16-2/sw.js')
      .catch(e => console.log('SW registratie mislukt:', e));
  });
}
</script>
