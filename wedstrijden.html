<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a1200">
<title>Wedstrijden — FCP 16-2</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="nav">
  <a class="nav-btn" href="index.html"><span class="nav-icon">⚡</span><span>Start</span></a>
  <a class="nav-btn" href="opstelling.html"><span class="nav-icon">🟢</span><span>Opstelling</span></a>
  <a class="nav-btn" href="selectie.html"><span class="nav-icon">👥</span><span>Selectie</span></a>
  <a class="nav-btn active" href="wedstrijden.html"><span class="nav-icon">⚽</span><span>Wedstrijden</span></a>
  <a class="nav-btn" href="schema.html"><span class="nav-icon">📅</span><span>Trainen</span></a>
  <a class="nav-btn" href="oefeningen.html"><span class="nav-icon">📚</span><span>Oefeningen</span></a>
  <a class="nav-btn" href="team.html"><span class="nav-icon">📊</span><span>Dashboard</span></a>
</nav>
<div class="scroll-top" id="scrollTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</div>
<div class="toast" id="toast"></div>

<div class="page-wrap">
  <div class="page-header">
    <div class="page-title">Wedstrijden</div>
    <div class="page-sub">Resultaten, cijfers en MOTM</div>
  </div>

  <div class="form-wrap" style="padding-top:12px">
    <div class="add-form">
      <div class="form-title">+ Nieuwe wedstrijd</div>
      <div class="form-row">
        <input class="form-input" id="wed-teg" placeholder="Tegenstander" type="text">
      </div>
      <div class="form-row">
        <input class="form-input" id="wed-datum" type="date" style="max-width:160px">
        <div class="thu-uit-btns" style="flex:1">
          <button class="thu-uit-btn active" id="btn-thuis" onclick="setThuisUit('thuis')">Thuis</button>
          <button class="thu-uit-btn" id="btn-uit"   onclick="setThuisUit('uit')">Uit</button>
        </div>
      </div>
      <div class="form-row">
        <button class="form-btn" onclick="addWedstrijd()" style="width:100%">Toevoegen</button>
      </div>
    </div>

    <div id="wed-list"><div style="font-size:12px;color:var(--text3)">Nog geen wedstrijden.</div></div>

    <!-- Ranking -->
    <div style="margin-top:20px;padding-top:14px;border-top:1px solid var(--line2)">
      <div style="font-family:'Fraunces',serif;font-size:18px;font-weight:600;color:var(--text);margin-bottom:10px">Seizoen ranking</div>
      <div id="ranking-cont"><div style="font-size:12px;color:var(--text3)">Vul cijfers in bij wedstrijden om de ranking te zien.</div></div>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script>
let wedstrijden = loadState().wedstrijden;
let players     = loadState().players;
let thuisUit    = 'thuis';

function setThuisUit(val) {
  thuisUit = val;
  document.getElementById('btn-thuis').classList.toggle('active', val === 'thuis');
  document.getElementById('btn-uit').classList.toggle('active',   val === 'uit');
}

async function addWedstrijd() {
  const teg = document.getElementById('wed-teg').value.trim();
  if (!teg) { showToast('Vul een tegenstander in'); return; }
  const rawDatum = document.getElementById('wed-datum').value;
  const datum = rawDatum ? formatDatumShort(rawDatum) : '';
  const w = { id:genId(), tegenstander:teg, datum, thuis_uit:thuisUit, score_eigen:0, score_tegen:0, opmerkingen:'', ratings:{}, motm:null };
  if (supabaseReady) {
    // Alleen de basiskolommen sturen bij aanmaken
    const res = await sbFetch('wedstrijden', 'POST', { id:w.id, tegenstander:w.tegenstander, datum:w.datum, thuis_uit:w.thuis_uit, score_eigen:0, score_tegen:0, opmerkingen:'' });
    if (!res || res._error) { showToast('Opslaan mislukt — ' + (res?.message||'check Supabase')); return; }
  }
  wedstrijden.push(w);
  saveWedstrijden(wedstrijden);
  renderWedstrijden();
  document.getElementById('wed-teg').value = '';
  document.getElementById('wed-datum').value = '';
  showToast(teg + ' toegevoegd');
}

async function saveWedstrijd(id) {
  const w = wedstrijden.find(x => x.id === id); if (!w) return;
  w.score_eigen = parseInt(document.getElementById('ws-eigen-' + id).value) || 0;
  w.score_tegen = parseInt(document.getElementById('ws-tegen-' + id).value) || 0;
  w.opmerkingen = document.getElementById('ws-opm-' + id).value;
  w.motm        = document.getElementById('ws-motm-' + id).value || null;
  w.formatie    = document.getElementById('ws-form-' + id).value || null;
  if (!w.ratings) w.ratings = {};
  players.forEach(p => {
    const el = document.getElementById('rat-' + id + '-' + p.id);
    if (el && el.value) w.ratings[p.id] = parseFloat(el.value);
    else if (el) delete w.ratings[p.id];
  });
  saveWedstrijden(wedstrijden);
  if (supabaseReady) {
    await sbFetch('wedstrijden?id=eq.' + id, 'PATCH', {
      score_eigen: w.score_eigen,
      score_tegen: w.score_tegen,
      opmerkingen: w.opmerkingen,
      ratings:     JSON.stringify(w.ratings || {}),
      motm:        w.motm || null,
    });
  }
  renderRanking();
  showToast('Wedstrijd opgeslagen');
}

async function deleteWedstrijd(id) {
  const w = wedstrijden.find(x => x.id === id);
  if (!confirm('Verwijder ' + (w ? w.tegenstander : 'wedstrijd') + '?')) return;
  wedstrijden = wedstrijden.filter(x => x.id !== id);
  saveWedstrijden(wedstrijden);
  if (supabaseReady) await sbFetch('wedstrijden?id=eq.' + id, 'DELETE');
  renderWedstrijden();
  showToast('Wedstrijd verwijderd');
}

function setMotm(wedId, playerId) {
  const w = wedstrijden.find(x => x.id === wedId); if (!w) return;
  w.motm = w.motm === playerId ? null : playerId;
  saveWedstrijden(wedstrijden);
  if (supabaseReady) sbFetch('wedstrijden?id=eq.' + wedId, 'PATCH', { motm: w.motm || null });
  renderWedstrijden();
  renderRanking();
  const p = players.find(pl => pl.id === playerId);
  showToast(w.motm ? '⭐ MOTM: ' + (p ? p.naam : '') : 'MOTM verwijderd');
}

function renderWedstrijden() {
  const list = document.getElementById('wed-list');
  if (!wedstrijden.length) { list.innerHTML = '<div style="font-size:12px;color:var(--text3)">Nog geen wedstrijden.</div>'; return; }
  list.innerHTML = '';
  [...wedstrijden].reverse().forEach(w => {
    const card = document.createElement('div');
    card.className = 'card'; card.id = 'wcard-' + w.id;
    const rc = w.score_eigen > w.score_tegen ? '#70e890' : w.score_eigen < w.score_tegen ? '#f04070' : '#f0c040';
    const rl = w.score_eigen > w.score_tegen ? 'W' : w.score_eigen < w.score_tegen ? 'V' : 'G';
    const motmP = w.motm ? players.find(p => p.id === w.motm) : null;
    const motmOptions = sortedPlayers(players).map(p =>
      `<option value="${p.id}" ${w.motm===p.id?'selected':''}>${p.naam}</option>`
    ).join('');
    const lineupOpties = Object.keys(FORMATIES).map(f =>
      `<option value="${f}" ${w.formatie===f?'selected':''}>${FORMATIES[f].label}</option>`
    ).join('');
    const ratingsHtml = players.length ? `
      <div style="font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin:10px 0 6px">Spelersbeoordelingen (1–10)</div>
      <div style="display:flex;flex-direction:column;gap:5px;margin-bottom:8px">
        ${sortedPlayers(players).map(p => {
          const rating = w.ratings && w.ratings[p.id] || '';
          return `<div style="display:flex;align-items:center;gap:8px">
            <span style="flex:1;font-size:12px;color:var(--text)">${p.naam}</span>
            <input type="number" min="1" max="10" step="0.5" placeholder="—" value="${rating}"
              id="rat-${w.id}-${p.id}"
              style="width:52px;padding:4px 6px;background:var(--bg3);border:1px solid var(--line2);border-radius:4px;color:var(--accent);font-family:'Fraunces',serif;font-size:16px;font-weight:600;text-align:center;outline:none">
          </div>`;
        }).join('')}
      </div>` : '';
    card.innerHTML = `
      <div class="card-hdr" onclick="this.closest('.card').classList.toggle('open')">
        <div class="wed-score-big" style="color:${rc}">${w.score_eigen}–${w.score_tegen}</div>
        <div class="card-info">
          <div class="card-title">${w.tegenstander}</div>
          <div class="card-sub">${w.datum||'–'} · ${w.thuis_uit} · <span style="color:${rc}">${rl}</span>${motmP ? ' · ⭐ '+motmP.naam : ''}</div>
        </div>
        <span class="card-chev">▾</span>
      </div>
      <div class="card-body">
        <div style="font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">Eindstand</div>
        <div class="wed-score-row">
          <input class="wed-score-input" id="ws-eigen-${w.id}" type="number" min="0" max="99" value="${w.score_eigen}">
          <span class="wed-score-sep">–</span>
          <input class="wed-score-input" id="ws-tegen-${w.id}" type="number" min="0" max="99" value="${w.score_tegen}">
          <span style="font-size:11px;color:var(--text3);margin-left:6px">FCP – ${w.tegenstander}</span>
        </div>
        <div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap">
          <div style="flex:1;min-width:130px">
            <div style="font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px">Formatie</div>
            <select id="ws-form-${w.id}" style="width:100%;padding:8px;background:var(--bg3);border:1px solid var(--line2);border-radius:var(--rsm);color:var(--text);font-family:'DM Mono',monospace;font-size:12px;outline:none">
              <option value="">— geen —</option>${lineupOpties}
            </select>
          </div>
          <div style="flex:1;min-width:130px">
            <div style="font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px">Man of the Match ⭐</div>
            <select id="ws-motm-${w.id}" style="width:100%;padding:8px;background:var(--bg3);border:1px solid var(--line2);border-radius:var(--rsm);color:var(--text);font-family:'DM Mono',monospace;font-size:12px;outline:none">
              <option value="">— geen —</option>${motmOptions}
            </select>
          </div>
        </div>
        ${ratingsHtml}
        <div style="font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px">Opmerkingen</div>
        <textarea style="width:100%;padding:8px 11px;background:var(--bg3);border:1px solid var(--line2);border-radius:var(--rsm);color:var(--text);font-family:'DM Mono',monospace;font-size:12px;outline:none;resize:vertical;min-height:65px;line-height:1.5" id="ws-opm-${w.id}" placeholder="Hoe verliep de wedstrijd?">${w.opmerkingen||''}</textarea>
        <div class="player-actions">
          <button class="save-btn" onclick="saveWedstrijd('${w.id}')">💾 Opslaan</button>
          <button class="del-btn" onclick="deleteWedstrijd('${w.id}')">Verwijder</button>
        </div>
      </div>`;
    list.appendChild(card);
  });
  renderRanking();
}

function renderRanking() {
  const cont = document.getElementById('ranking-cont'); if (!cont) return;
  if (!players.length || !wedstrijden.length) { cont.innerHTML = '<div style="font-size:12px;color:var(--text3)">Voeg spelers en wedstrijden toe.</div>'; return; }
  const ratingMap = {}; const motmMap = {};
  sortedPlayers(players).forEach(p => { ratingMap[p.id] = {sum:0,count:0}; motmMap[p.id] = 0; });
  wedstrijden.forEach(w => {
    if (w.ratings) Object.entries(w.ratings).forEach(([pid,val]) => { if (ratingMap[pid]) { ratingMap[pid].sum += val; ratingMap[pid].count++; } });
    if (w.motm && motmMap[w.motm] !== undefined) motmMap[w.motm]++;
  });
  const ranked = sortedPlayers(players).map(p => ({ p, avg: ratingMap[p.id].count ? Math.round(ratingMap[p.id].sum/ratingMap[p.id].count*10)/10 : null, count: ratingMap[p.id].count, motm: motmMap[p.id] })).filter(x => x.avg !== null || x.motm > 0).sort((a,b) => (b.avg||0)-(a.avg||0));
  const motmRanked = sortedPlayers(players).map(p => ({ p, motm: motmMap[p.id] })).filter(x => x.motm > 0).sort((a,b) => b.motm - a.motm);
  let html = '';
  if (ranked.length) {
    html += `<div style="font-family:'Fraunces',serif;font-size:15px;font-weight:600;color:var(--text);margin-bottom:8px">Gemiddeld cijfer</div>`;
    ranked.forEach((x,i) => {
      const col = x.avg>=8?'#40f090':x.avg>=6.5?'#a8e040':x.avg>=5?'#f0c040':'#f07040';
      html += `<div style="display:flex;align-items:center;gap:8px;margin-bottom:7px">
        <span style="font-size:11px;color:var(--text3);min-width:16px">${i+1}</span>
        <span style="flex:1;font-size:13px;color:var(--text)">${x.p.naam}</span>
        <span style="font-size:11px;color:var(--text3)">${x.count}×</span>
        <span style="font-family:'Fraunces',serif;font-size:18px;font-weight:600;color:${col};min-width:32px;text-align:right">${x.avg||'—'}</span>
      </div>`;
    });
  }
  if (motmRanked.length) {
    html += `<div style="font-family:'Fraunces',serif;font-size:15px;font-weight:600;color:var(--text);margin:16px 0 8px;padding-top:12px;border-top:1px solid var(--line2)">Man of the Match</div>`;
    motmRanked.forEach((x,i) => {
      html += `<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
        <span style="font-size:11px;color:var(--text3);min-width:16px">${i+1}</span>
        <span style="flex:1;font-size:13px;color:var(--text)">${x.p.naam}</span>
        <span style="font-size:13px;color:#f0c040">⭐ × ${x.motm}</span>
      </div>`;
    });
  }
  if (!html) html = '<div style="font-size:12px;color:var(--text3)">Nog geen beoordelingen ingevuld.</div>';
  cont.innerHTML = html;
}

async function onSupabaseReady() {
  const data = await loadFromSupabase();
  if (data.players)     players     = data.players;
  if (data.wedstrijden) wedstrijden = data.wedstrijden;
  renderWedstrijden();
}

renderWedstrijden();
initScrollTop();
initManifest();
initSupabase().then(ok => { if (ok) onSupabaseReady(); });
</script>
</body>
</html>
